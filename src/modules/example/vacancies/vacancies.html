<template lwc:render-mode="light">
    <ui-site-header current="vacancies"></ui-site-header>

    <div class="site__body">
        <main class="site__main">
            <div class="slds-page-header slds-m-bottom_medium">
                <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:job_profile" size="medium"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h1 class="slds-page-header__title slds-truncate">Vacancies</h1>
                                <p class="slds-page-header__name-meta">
                                    Live from the SQLite database via /api/jobs.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div lwc:if={loading} class="slds-is-relative vacancies__loading slds-box slds-theme_default">
                <lightning-spinner alternative-text="Loading vacancies" size="small"></lightning-spinner>
            </div>

            <div lwc:elseif={hasError} class="slds-box slds-theme_default">
                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                <span>{error}</span>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                    The data API runs under <code>npm run dev</code> only.
                </p>
            </div>

            <template lwc:elseif={hasJobs}>
                <div class="slds-box slds-box_x-small slds-theme_default">
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                        {count} vacancies
                    </p>
                    <lightning-datatable
                        key-field="id"
                        columns={columns}
                        data={jobs}
                        hide-checkbox-column
                    ></lightning-datatable>
                </div>
            </template>

            <div lwc:else class="slds-box slds-theme_default">
                <p>No vacancies for this account.</p>
            </div>
        </main>
    </div>
</template>
