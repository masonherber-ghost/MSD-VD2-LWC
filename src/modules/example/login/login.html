<template lwc:render-mode="light">
    <ui-site-header current="login"></ui-site-header>

    <div class="site__body">
        <main class="site__main auth">
            <lightning-card>
                <div class="slds-p-around_large slds-text-align_center">
                    <h1>Employer login</h1>

                    <p class="slds-m-top_small">
                        Welcome to the employer portal. To start creating vacancies
                        authenticate with RealMe.
                    </p>

                    <div class="slds-m-top_medium">
                        <lightning-button
                            class="login__realme"
                            label="Log in with RealMe"
                            icon-name="utility:forward"
                            icon-position="right"
                            onclick={handleRealmeLogin}
                        ></lightning-button>
                    </div>
                </div>
            </lightning-card>
        </main>
    </div>

    <ui-site-footer></ui-site-footer>
</template>
