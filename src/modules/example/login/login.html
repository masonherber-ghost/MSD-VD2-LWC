<template lwc:render-mode="light">
    <ui-site-header current="login"></ui-site-header>

    <div class="site__body">
        <main class="site__main auth">
            <lightning-card>
                <div class="slds-p-around_large">
                    <div class="slds-align_absolute-center slds-m-bottom_medium">
                        <lightning-icon icon-name="utility:lock" size="small"></lightning-icon>
                        <h1 class="slds-text-heading_medium slds-m-left_x-small">Log in</h1>
                    </div>

                    <div lwc:if={hasError} class="slds-m-bottom_small">
                        <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                            <span class="slds-assistive-text">Error</span>
                            <span>{error}</span>
                        </div>
                    </div>

                    <lightning-input
                        type="email"
                        label="Email"
                        value={email}
                        onchange={handleEmail}
                        onkeyup={handleKeyUp}
                        autocomplete="username"
                        required
                    ></lightning-input>

                    <lightning-input
                        class="slds-m-top_small"
                        type="password"
                        label="Password"
                        value={password}
                        onchange={handlePassword}
                        onkeyup={handleKeyUp}
                        autocomplete="current-password"
                        required
                    ></lightning-input>

                    <div class="slds-m-top_medium">
                        <lightning-button
                            variant="brand"
                            label="Log in"
                            onclick={handleSubmit}
                            disabled={submitting}
                            class="auth__submit"
                        ></lightning-button>
                    </div>

                    <p class="slds-text-body_small slds-m-top_medium slds-text-align_center">
                        No account yet? <a href="/register">Create one</a>
                    </p>
                </div>
            </lightning-card>

            <div class="slds-box slds-box_x-small slds-theme_shade slds-m-top_small">
                <p class="slds-text-body_small slds-text-color_weak">Prototype logins</p>
                <ul class="slds-list_dotted slds-text-body_small slds-m-top_xx-small">
                    <li><code>employer@test.com</code></li>
                    <li><code>employer6@test.com</code></li>
                </ul>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                    Password for both: <code>password123</code>
                </p>
            </div>
        </main>
    </div>
</template>
