<template lwc:render-mode="light">
    <ui-site-header current="jobs"></ui-site-header>

    <div class="site__body">
        <main class="site__main">
            <div lwc:if={loading} class="slds-is-relative job-detail__loading slds-box slds-theme_default">
                <lightning-spinner alternative-text="Loading vacancies" size="small"></lightning-spinner>
            </div>

            <div lwc:elseif={hasError} class="slds-box slds-theme_default">
                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                <span>{error}</span>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                    The data API runs under <code>npm run dev</code> only.
                </p>
            </div>

            <template lwc:elseif={hasJob}>
                <lightning-breadcrumbs class="slds-m-bottom_x-small">
                    <lightning-breadcrumb label="My jobs" href="/jobs"></lightning-breadcrumb>
                    <lightning-breadcrumb
                        label={recordTitle}
                        href={recordHref}
                    ></lightning-breadcrumb>
                </lightning-breadcrumbs>

                <!-- Highlights panel ---------------------------------------->
                <div class="slds-page-header">
                    <div class="slds-page-header__row">
                        <div class="slds-page-header__col-title">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon
                                        icon-name="standard:job_profile"
                                        size="medium"
                                    ></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <div class="slds-page-header__name">
                                        <div class="slds-page-header__name-title">
                                            <h1>
                                                <span class="slds-page-header__title slds-truncate">
                                                    {recordTitle}
                                                </span>
                                            </h1>
                                        </div>
                                        <div class="slds-page-header__name-switcher">
                                            <lightning-button-menu
                                                icon-name="utility:down"
                                                icon-size="x-small"
                                                variant="bare"
                                                alternative-text="Switch vacancy"
                                                menu-alignment="left"
                                                onselect={handleRecordSwitch}
                                            >
                                                <template for:each={recordOptions} for:item="option">
                                                    <lightning-menu-item
                                                        key={option.value}
                                                        value={option.value}
                                                        label={option.label}
                                                        checked={option.checked}
                                                    ></lightning-menu-item>
                                                </template>
                                            </lightning-button-menu>
                                        </div>
                                    </div>
                                    <p class="slds-page-header__name-meta">
                                        Vacancy &bull; {job.subtitle}
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div class="slds-page-header__col-actions">
                            <div class="slds-page-header__controls">
                                <div class="slds-page-header__control">
                                    <lightning-button-group>
                                        <lightning-button label="Edit"></lightning-button>
                                        <lightning-button label="View applicants"></lightning-button>
                                        <lightning-button-menu
                                            icon-name="utility:down"
                                            alternative-text="More actions"
                                            menu-alignment="right"
                                        >
                                            <lightning-menu-item
                                                value="clone"
                                                label="Clone vacancy"
                                            ></lightning-menu-item>
                                            <lightning-menu-item
                                                value="close"
                                                label="Close vacancy"
                                            ></lightning-menu-item>
                                            <lightning-menu-item
                                                value="delete"
                                                label="Delete"
                                            ></lightning-menu-item>
                                        </lightning-button-menu>
                                    </lightning-button-group>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="slds-page-header__row slds-page-header__row_gutters">
                        <div class="slds-page-header__col-details">
                            <ul class="slds-page-header__detail-row">
                                <li class="slds-page-header__detail-block">
                                    <div class="slds-text-title slds-truncate">Status</div>
                                    <div class="slds-truncate">
                                        <lightning-badge label={statusLabel}></lightning-badge>
                                    </div>
                                </li>
                                <li class="slds-page-header__detail-block">
                                    <div class="slds-text-title slds-truncate">Location</div>
                                    <div class="slds-truncate" title={job.location}>{job.location}</div>
                                </li>
                                <li class="slds-page-header__detail-block">
                                    <div class="slds-text-title slds-truncate">Pay</div>
                                    <div class="slds-truncate" title={job.pay}>{job.pay}</div>
                                </li>
                                <li class="slds-page-header__detail-block">
                                    <div class="slds-text-title slds-truncate">Applicants</div>
                                    <div class="slds-truncate">{candidateCount}</div>
                                </li>
                                <li class="slds-page-header__detail-block">
                                    <div class="slds-text-title slds-truncate">Closes</div>
                                    <div class="slds-truncate">{job.closing_date}</div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Path ------------------------------------------------------>
                <div class="slds-m-vertical_medium">
                    <lightning-progress-indicator
                        type="path"
                        variant="base"
                        current-step={job.status}
                    >
                        <template for:each={pathSteps} for:item="step">
                            <lightning-progress-step
                                key={step.value}
                                label={step.label}
                                value={step.value}
                            ></lightning-progress-step>
                        </template>
                    </lightning-progress-indicator>
                </div>

                <!-- Split content body: 2:1 ---------------------------------->
                <lightning-layout multiple-rows class="slds-gutters">
                    <lightning-layout-item size="12" large-device-size="8" padding="around-small">
                        <lightning-tabset variant="scoped">
                            <lightning-tab label="Details">
                                <lightning-layout multiple-rows class="slds-gutters">
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <template for:each={detailColumnOne} for:item="field">
                                            <div key={field.key} class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                                <span class="slds-form-element__label">{field.label}</span>
                                                <div class="slds-form-element__control">
                                                    <div class="slds-form-element__static">{field.value}</div>
                                                </div>
                                            </div>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <template for:each={detailColumnTwo} for:item="field">
                                            <div key={field.key} class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                                <span class="slds-form-element__label">{field.label}</span>
                                                <div class="slds-form-element__control">
                                                    <div class="slds-form-element__static">{field.value}</div>
                                                </div>
                                            </div>
                                        </template>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="12" class="slds-m-top_medium">
                                        <div class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Description</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">
                                                    <lightning-formatted-text
                                                        value={job.description}
                                                    ></lightning-formatted-text>
                                                </div>
                                            </div>
                                        </div>
                                    </lightning-layout-item>

                                    <lightning-layout-item lwc:if={hasResponsibilities} size="12" class="slds-m-top_medium">
                                        <div class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Responsibilities</span>
                                            <ul class="slds-list_dotted slds-m-top_xx-small">
                                                <template for:each={responsibilities} for:item="item">
                                                    <li key={item.key}>{item.text}</li>
                                                </template>
                                            </ul>
                                        </div>
                                    </lightning-layout-item>

                                    <lightning-layout-item lwc:if={hasSkills} size="12" class="slds-m-top_medium">
                                        <div class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Skills</span>
                                            <div class="slds-m-top_xx-small">
                                                <template for:each={skills} for:item="item">
                                                    <lightning-pill
                                                        key={item.key}
                                                        label={item.text}
                                                        variant="plain"
                                                    ></lightning-pill>
                                                </template>
                                            </div>
                                        </div>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-tab>

                            <lightning-tab label={relatedLabel}>
                                <template lwc:if={hasCandidates}>
                                    <lightning-datatable
                                        key-field="id"
                                        columns={candidateColumns}
                                        data={candidateRows}
                                        hide-checkbox-column
                                    ></lightning-datatable>
                                </template>
                                <p lwc:else class="slds-text-color_weak slds-p-around_medium">
                                    No applicants for this vacancy yet.
                                </p>
                            </lightning-tab>
                        </lightning-tabset>
                    </lightning-layout-item>

                    <!-- Sidebar region ------------------------------------->
                    <lightning-layout-item size="12" large-device-size="4" padding="around-small">
                        <lightning-card title="Applicant pipeline" icon-name="standard:groups">
                            <div class="slds-p-horizontal_medium">
                                <template lwc:if={hasPipeline}>
                                    <ul class="slds-has-dividers_bottom-space">
                                        <template for:each={pipeline} for:item="stage">
                                            <li key={stage.key} class="slds-item slds-grid slds-grid_align-spread">
                                                <span>{stage.label}</span>
                                                <span class="slds-text-title_bold">{stage.count}</span>
                                            </li>
                                        </template>
                                    </ul>
                                    <div class="slds-m-top_medium">
                                        <lightning-progress-bar
                                            value={shortlistProgress}
                                            size="large"
                                        ></lightning-progress-bar>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                            {shortlistCaption}
                                        </p>
                                    </div>
                                </template>
                                <p lwc:else class="slds-text-color_weak">No applicants yet.</p>
                            </div>
                        </lightning-card>

                        <lightning-card title="Activity" icon-name="standard:task" class="slds-m-top_medium">
                            <div class="slds-p-horizontal_medium">
                                <template lwc:if={hasTimeline}>
                                    <ul class="slds-has-dividers_bottom-space">
                                        <template for:each={timeline} for:item="event">
                                            <li key={event.key} class="slds-item">
                                                <div class="slds-media">
                                                    <div class="slds-media__figure">
                                                        <lightning-icon
                                                            icon-name="standard:contact"
                                                            size="small"
                                                        ></lightning-icon>
                                                    </div>
                                                    <div class="slds-media__body">
                                                        <p class="slds-truncate" title={event.title}>
                                                            {event.title}
                                                        </p>
                                                        <p class="slds-text-body_small slds-text-color_weak">
                                                            {event.meta}
                                                        </p>
                                                        <p class="slds-text-body_small slds-text-color_weak">
                                                            {event.date}
                                                        </p>
                                                    </div>
                                                </div>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                                <p lwc:else class="slds-text-color_weak">Nothing logged yet.</p>
                            </div>
                        </lightning-card>

                        <lightning-card lwc:if={hasContact} title="Vacancy contact" icon-name="standard:user" class="slds-m-top_medium">
                            <div class="slds-p-horizontal_medium">
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-avatar
                                            fallback-icon-name="standard:user"
                                            alternative-text={contactName}
                                        ></lightning-avatar>
                                    </div>
                                    <div class="slds-media__body">
                                        <p class="slds-text-title_bold">{contactName}</p>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            {vacancyContact.job_title}
                                        </p>
                                        <lightning-formatted-phone
                                            value={vacancyContact.phone}
                                        ></lightning-formatted-phone>
                                    </div>
                                </div>
                            </div>
                        </lightning-card>
                    </lightning-layout-item>
                </lightning-layout>
            </template>

            <div lwc:else class="slds-box slds-theme_default">
                <p>No vacancies for this account.</p>
            </div>
        </main>
    </div>
</template>
