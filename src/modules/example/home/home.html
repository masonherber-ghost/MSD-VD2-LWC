<template lwc:render-mode="light">
    <ui-site-header current="home"></ui-site-header>

    <div class="site__body">
        <main class="site__main home">
            <!-- One measure for the whole screen.
                 The page header, the welcome panel and the card grid are all
                 children of a single 10-of-12 column rather than each being
                 sized on its own, so they cannot drift out of alignment with
                 one another. Full width below the large breakpoint, where ten
                 columns of a narrow viewport would leave the cards unreadable.

                 Both branches sit inside the one column: `lwc:if` and
                 `lwc:else` have to stay siblings, and the signed-out pitch
                 wants the same left edge as the signed-in dashboard.

                 No `padding` on the item: the card grid nested inside already
                 pairs `padding="around-small"` with `pull-to-boundary="small"`,
                 which cancels at the edges. Adding padding here would inset the
                 cards but not the page header above them. -->
            <lightning-layout horizontal-align="center">
                <lightning-layout-item id="home-col-main" size="12" large-device-size="10">
                    <!-- Signed in: the homepage template (Figma 181:39504) ------->
                    <template lwc:if={isSignedIn}>
                        <!-- Hero. The design draws a full-bleed grey band; content is
                             capped by .site__main and nothing shipped breaks out of it,
                             so by decision this is the SLDS box blueprint with the
                             shade theme, inside the column. No project CSS.
                             Type: sep-font-scale-8 / -6 with sep-text-accent-primary,
                             the approved project utilities. -->
                        <section id="home-hero" class="slds-m-bottom_x-large">
                            <h1 id="home-hero-title" class="sep-font-scale-8 sep-text-accent-primary">
                                Kia ora {firstName}
                            </h1>
                            <p lwc:if={companyName} id="home-hero-company" class="sep-font-scale-6 sep-text-accent-primary slds-m-top_small">
                                {companyName}
                            </p>
                            <!-- Quick links: the SLDS button blueprint on an anchor, so a
                                 link that looks like a button is still a link. -->
                            <div id="home-hero-links" class="slds-m-top_large">
                                <a id="home-quick-new-job" class="slds-button slds-button_neutral slds-m-right_small slds-m-bottom_x-small" href="/create-job/step2?start=new">
                                    <lightning-icon icon-name="standard:job_profile" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    List a new job
                                </a>
                                <a id="home-quick-my-jobs" class="slds-button slds-button_neutral slds-m-bottom_x-small" href="/jobs">
                                    <lightning-icon icon-name="standard:task" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    My jobs
                                </a>
                            </div>
                        </section>

                        <!-- Jobs in progress ------------------------------------->
                        <section id="home-jobs" class="slds-m-bottom_x-large">
                            <h2 id="home-jobs-heading" class="sep-font-scale-4 sep-text-primary slds-m-bottom_medium">Jobs in-progress</h2>

                            <!-- Each card in a block wrapper: a custom element is
                                 inline, so the margin goes on the div. No id inside
                                 the loop — `key` is the handle. -->
                            <template lwc:if={hasInProgress}>
                                <template for:each={inProgressCards} for:item="card">
                                    <div key={card.id} class="slds-m-bottom_medium">
                                        <ui-vacancy-listing-card card={card}></ui-vacancy-listing-card>
                                    </div>
                                </template>
                                <div class="slds-align_absolute-center">
                                    <a id="home-jobs-view-all" class="slds-button slds-button_brand" href="/jobs">View all jobs</a>
                                </div>
                            </template>

                            <div lwc:elseif={hasNoVacancies} id="home-jobs-empty">
                                <ui-vacancy-empty-state></ui-vacancy-empty-state>
                            </div>

                            <p lwc:elseif={hasOnlyClosed} id="home-jobs-none-open" class="slds-text-color_weak">
                                You have no jobs in progress. <a href="/jobs">View all jobs</a>
                            </p>

                            <p lwc:elseif={hasError} id="home-jobs-error" class="slds-text-color_weak">{error}</p>
                        </section>

                        <!-- Help centre — placeholder topics, see HELP_TOPICS ---->
                        <section id="home-help">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                <h2 id="home-help-heading" class="sep-font-scale-4 sep-text-primary">Help centre</h2>
                                <a id="home-help-all-button" class="slds-button slds-button_neutral" href="/help-centre">See all articles</a>
                            </div>
                            <lightning-layout multiple-rows pull-to-boundary="small">
                                <template for:each={helpTopics} for:item="topic">
                                    <lightning-layout-item key={topic.key} size="12" medium-device-size="4" padding="around-small">
                                        <a href={topic.href} class="slds-text-body_regular">{topic.label}</a>
                                    </lightning-layout-item>
                                </template>
                            </lightning-layout>
                        </section>
                    </template>

                    <!-- Signed out: the pitch ------------------------------------->
                    <template lwc:else>
                        <div class="home__marketing">
                        <div class="home__hero slds-box slds-theme_default">
                            <h1>Hire with MSD</h1>
                            <p class="slds-text-body_regular slds-m-top_x-small slds-text-color_weak">
                                List a vacancy, reach job seekers across Aotearoa, and manage your
                                applicants in one place.
                            </p>
                            <div class="slds-m-top_medium slds-grid slds-grid_vertical-align-center">
                                <a href="/login">
                                    <lightning-button
                                        variant="brand"
                                        label="Log in"
                                    ></lightning-button>
                                </a>
                                <a href="/register" class="slds-m-left_x-small">
                                    <lightning-button label="Create an account"></lightning-button>
                                </a>
                            </div>
                        </div>

                        <div class="home__stats slds-m-top_medium">
                            <article class="slds-box slds-theme_default">
                                <lightning-icon icon-name="utility:list" size="small"></lightning-icon>
                                <h2 class="slds-m-top_x-small">List a vacancy</h2>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Publish a job and start receiving applications.
                                </p>
                            </article>
                            <article class="slds-box slds-theme_default">
                                <lightning-icon icon-name="utility:groups" size="small"></lightning-icon>
                                <h2 class="slds-m-top_x-small">Manage applicants</h2>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Shortlist, track and respond from one screen.
                                </p>
                            </article>
                            <article class="slds-box slds-theme_default">
                                <lightning-icon icon-name="utility:company" size="small"></lightning-icon>
                                <h2 class="slds-m-top_x-small">Build your profile</h2>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Show job seekers who you are and what you stand for.
                                </p>
                            </article>
                        </div>
                        </div>
                    </template>
                </lightning-layout-item>
            </lightning-layout>
        </main>
    </div>

    <ui-site-footer></ui-site-footer>
</template>
