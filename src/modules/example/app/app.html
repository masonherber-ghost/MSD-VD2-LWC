<template lwc:render-mode="light">
    <div class="site">
        <!-- Global header, mirroring the Lightning Experience chrome -->
        <header class="slds-global-header_container">
            <div class="slds-global-header slds-grid slds-grid_align-spread">
                <div class="slds-global-header__item">
                    <div class="slds-global-header__logo site__logo">
                        <lightning-icon icon-name="utility:apps" size="small"></lightning-icon>
                        <span class="slds-text-heading_small site__wordmark">MSD Component Library</span>
                    </div>
                </div>
                <div class="slds-global-header__item slds-global-header__item_search">
                    <div class="slds-form-element">
                        <lightning-input
                            type="search"
                            label="Search components"
                            variant="label-hidden"
                            placeholder="Search this prototype..."
                        ></lightning-input>
                    </div>
                </div>
                <div class="slds-global-header__item">
                    <ul class="slds-global-actions slds-grid slds-grid_vertical-align-center">
                        <li class="slds-global-actions__item">
                            <lightning-button-icon
                                icon-name="utility:settings"
                                variant="bare"
                                alternative-text="Settings"
                            ></lightning-button-icon>
                        </li>
                        <li class="slds-global-actions__item slds-p-left_x-small">
                            <lightning-avatar
                                src="/public/assets/recipes-logo.png"
                                fallback-icon-name="standard:user"
                                alternative-text="User"
                                size="small"
                            ></lightning-avatar>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <div class="site__body slds-grid">
            <!-- Sidebar built from the library itself -->
            <aside class="site__sidebar slds-p-around_medium">
                <lightning-vertical-navigation
                    selected-item={activeSection}
                    onselect={handleNavSelect}
                >
                    <lightning-vertical-navigation-section label="Library">
                        <template for:each={sections} for:item="section">
                            <lightning-vertical-navigation-item
                                key={section.id}
                                label={section.label}
                                name={section.id}
                            ></lightning-vertical-navigation-item>
                        </template>
                    </lightning-vertical-navigation-section>
                </lightning-vertical-navigation>
            </aside>

            <main class="site__main slds-p-around_large">
                <div class="slds-page-header slds-m-bottom_large">
                    <div class="slds-page-header__row">
                        <div class="slds-page-header__col-title">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon
                                        icon-name="standard:apps"
                                        size="medium"
                                    ></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h1 class="slds-page-header__title slds-truncate">
                                        {currentSection.title}
                                    </h1>
                                    <p class="slds-page-header__name-meta">{currentSection.summary}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <gallery-overview lwc:if={isOverview} onnavigate={handleSectionJump}></gallery-overview>
                <gallery-buttons lwc:if={isButtons}></gallery-buttons>
                <gallery-forms lwc:if={isForms}></gallery-forms>
                <gallery-data lwc:if={isData}></gallery-data>
                <gallery-feedback lwc:if={isFeedback}></gallery-feedback>
                <gallery-layout lwc:if={isLayout}></gallery-layout>
                <ui-catalog-table lwc:if={isCatalog}></ui-catalog-table>
            </main>
        </div>
    </div>
</template>
