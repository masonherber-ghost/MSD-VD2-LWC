<template lwc:render-mode="light">
    <ui-site-header current="design-system"></ui-site-header>

    <div class="site__body">
        <main class="site__main">
            <div class="slds-page-header sep-page-header slds-m-bottom_medium">
                <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:apps" size="medium"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h1 class="slds-page-header__title slds-truncate">Design system</h1>
                                <p class="slds-page-header__name-meta">
                                    What ships: every component example, every blueprint and
                                    every design token — plus what this project built on top.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <lightning-tabset variant="scoped">
                <lightning-tab label="Components">
                    <ui-kitchen-sink></ui-kitchen-sink>
                </lightning-tab>
                <lightning-tab label="Blueprints">
                    <div class="slds-p-top_small">
                        <ui-blueprint-browser></ui-blueprint-browser>
                    </div>
                </lightning-tab>
                <lightning-tab label="Compositions">
                    <div class="slds-p-top_small">
                        <ui-composition-browser></ui-composition-browser>
                    </div>
                </lightning-tab>
                <lightning-tab label="Tokens">
                    <div class="slds-p-top_small">
                        <ui-token-browser section="tokens"></ui-token-browser>
                    </div>
                </lightning-tab>
                <lightning-tab label="Component hooks">
                    <div class="slds-p-top_small">
                        <ui-token-browser section="hooks"></ui-token-browser>
                    </div>
                </lightning-tab>
            </lightning-tabset>
        </main>
    </div>

    <ui-site-footer></ui-site-footer>
</template>
