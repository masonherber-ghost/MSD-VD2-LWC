<template lwc:render-mode="light">
    <ui-site-header current="profile"></ui-site-header>

    <div class="site__body">
        <main class="site__main">
            <div lwc:if={loading} class="slds-is-relative profile__loading slds-box slds-theme_default">
                <lightning-spinner alternative-text="Loading your profile" size="small"></lightning-spinner>
            </div>

            <!-- Signed out: this page has no meaning without a session. -->
            <template lwc:elseif={isSignedOut}>
                <lightning-card>
                    <div class="slds-p-around_large slds-align_absolute-center slds-text-align_center">
                        <div>
                            <lightning-icon icon-name="utility:lock" size="small"></lightning-icon>
                            <h1 class="slds-text-heading_medium slds-m-top_x-small">
                                Log in to see your profile
                            </h1>
                            <p class="slds-text-color_weak slds-m-top_xx-small">
                                Your profile details live on your account.
                            </p>
                            <div class="slds-m-top_medium">
                                <a href="/login">
                                    <lightning-button
                                        variant="brand"
                                        label="Log in"
                                    ></lightning-button>
                                </a>
                            </div>
                        </div>
                    </div>
                </lightning-card>
            </template>

            <template lwc:elseif={ready}>
                <!-- Highlights panel ---------------------------------------->
                <div class="slds-page-header slds-m-bottom_medium">
                    <div class="slds-page-header__row">
                        <div class="slds-page-header__col-title">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-avatar
                                        fallback-icon-name="standard:user"
                                        alternative-text={fullName}
                                        size="medium"
                                    ></lightning-avatar>
                                </div>
                                <div class="slds-media__body">
                                    <h1 class="slds-page-header__title slds-truncate">{fullName}</h1>
                                    <p class="slds-page-header__name-meta">My profile</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="slds-page-header__row slds-page-header__row_gutters">
                        <div class="slds-page-header__col-details">
                            <ul class="slds-page-header__detail-row">
                                <li class="slds-page-header__detail-block">
                                    <div class="slds-text-title slds-truncate">Email</div>
                                    <div class="slds-truncate" title={email}>{email}</div>
                                </li>
                                <li class="slds-page-header__detail-block">
                                    <div class="slds-text-title slds-truncate">Company</div>
                                    <div class="slds-truncate" title={companyName}>{companyName}</div>
                                </li>
                                <li class="slds-page-header__detail-block">
                                    <div class="slds-text-title slds-truncate">Role</div>
                                    <div class="slds-truncate">{roleLabel}</div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <lightning-layout multiple-rows class="slds-gutters">
                    <lightning-layout-item size="12" large-device-size="8" padding="around-small">
                        <lightning-card title="Your details" icon-name="standard:contact">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <div lwc:if={hasError} class="slds-m-bottom_small">
                                    <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                                        <span class="slds-assistive-text">Error</span>
                                        <span>{error}</span>
                                    </div>
                                </div>

                                <div lwc:if={saved} class="slds-m-bottom_small">
                                    <div class="slds-notify slds-notify_alert slds-theme_success" role="status">
                                        <span>Profile saved.</span>
                                    </div>
                                </div>

                                <lightning-layout multiple-rows class="slds-gutters">
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <lightning-input
                                            data-field="first_name"
                                            label="First name"
                                            value={draft.first_name}
                                            onchange={handleChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <lightning-input
                                            data-field="last_name"
                                            label="Last name"
                                            value={draft.last_name}
                                            onchange={handleChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <lightning-input
                                            data-field="job_title"
                                            label="Job title"
                                            value={draft.job_title}
                                            onchange={handleChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <lightning-input
                                            data-field="phone"
                                            type="tel"
                                            label="Phone"
                                            value={draft.phone}
                                            onchange={handleChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div slot="footer" class="slds-text-align_right">
                                <lightning-button
                                    label="Cancel"
                                    onclick={handleCancel}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    variant="brand"
                                    label="Save"
                                    onclick={handleSave}
                                    disabled={saving}
                                ></lightning-button>
                            </div>
                        </lightning-card>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" large-device-size="4" padding="around-small">
                        <lightning-card title="Sign-in" icon-name="standard:user">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Email</span>
                                    <div class="slds-form-element__control">
                                        <div class="slds-form-element__static">{email}</div>
                                    </div>
                                </div>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                    Your sign-in email cannot be changed here.
                                </p>
                            </div>
                        </lightning-card>

                        <lightning-card title="Organisation" icon-name="standard:account" class="slds-m-top_medium">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <div class="slds-form-element slds-form-element_readonly">
                                    <span class="slds-form-element__label">Company</span>
                                    <div class="slds-form-element__control">
                                        <div class="slds-form-element__static">{companyName}</div>
                                    </div>
                                </div>
                                <div class="slds-form-element slds-form-element_readonly slds-m-top_x-small">
                                    <span class="slds-form-element__label">Your role</span>
                                    <div class="slds-form-element__control">
                                        <div class="slds-form-element__static">{roleLabel}</div>
                                    </div>
                                </div>
                                <div class="slds-m-top_small">
                                    <a href="/manage-org">Manage org</a>
                                </div>
                            </div>
                        </lightning-card>
                    </lightning-layout-item>
                </lightning-layout>
            </template>

            <div lwc:else class="slds-box slds-theme_default">
                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                <span>{error}</span>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                    The data API runs under <code>npm run dev</code> only.
                </p>
            </div>
        </main>
    </div>
</template>
