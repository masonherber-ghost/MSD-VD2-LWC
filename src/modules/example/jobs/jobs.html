<template lwc:render-mode="light">
    <ui-site-header current="jobs"></ui-site-header>

    <div class="site__body">
        <main class="site__main">
            <!-- Object home header ------------------------------------------>
            <div class="slds-page-header slds-page-header_object-home slds-m-bottom_medium">
                <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon
                                    icon-name="standard:job_profile"
                                    size="medium"
                                ></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-page-header__name">
                                    <div class="slds-page-header__name-title">
                                        <h1>
                                            <span>Vacancies</span>
                                            <span class="slds-page-header__title slds-truncate">
                                                My jobs
                                            </span>
                                        </h1>
                                    </div>
                                </div>
                                <p class="slds-page-header__name-meta">{itemCount}</p>
                            </div>
                        </div>
                    </div>
                    <div class="slds-page-header__col-actions">
                        <div class="slds-page-header__controls">
                            <div class="slds-page-header__control">
                                <a href="/list-a-job">
                                    <lightning-button
                                        variant="brand"
                                        label="List a job"
                                    ></lightning-button>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div lwc:if={loading} class="slds-is-relative jobs__loading slds-box slds-theme_default">
                <lightning-spinner alternative-text="Loading vacancies" size="small"></lightning-spinner>
            </div>

            <div lwc:elseif={hasError} class="slds-box slds-theme_default">
                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                <span>{error}</span>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                    The data API runs under <code>npm run dev</code> only.
                </p>
            </div>

            <!-- Card grid ---------------------------------------------------->
            <lightning-layout lwc:elseif={hasJobs} multiple-rows class="slds-gutters">
                <template for:each={cards} for:item="card">
                    <lightning-layout-item
                        key={card.id}
                        size="12"
                        medium-device-size="6"
                        large-device-size="4"
                        padding="around-small"
                        class="jobs__cell"
                    >
                        <lightning-card icon-name="standard:job_profile">
                            <h2 slot="title" class="slds-truncate">
                                <a href={card.href} class="jobs__link" title={card.title}>
                                    {card.title}
                                </a>
                                <span class="slds-text-body_small slds-text-color_weak jobs__subtitle">
                                    {card.subtitle}
                                </span>
                            </h2>
                            <lightning-badge
                                slot="actions"
                                label={card.statusLabel}
                            ></lightning-badge>

                            <div class="slds-p-horizontal_medium">
                                <dl class="slds-list_horizontal slds-wrap">
                                    <dt class="slds-item_label slds-text-color_weak slds-truncate">Location</dt>
                                    <dd class="slds-item_detail slds-truncate" title={card.location}>
                                        {card.location}
                                    </dd>
                                    <dt class="slds-item_label slds-text-color_weak slds-truncate">Pay</dt>
                                    <dd class="slds-item_detail slds-truncate">{card.pay}</dd>
                                    <dt class="slds-item_label slds-text-color_weak slds-truncate">Contract</dt>
                                    <dd class="slds-item_detail slds-truncate">{card.contractType}</dd>
                                    <dt class="slds-item_label slds-text-color_weak slds-truncate">Closes</dt>
                                    <dd class="slds-item_detail slds-truncate">{card.closingDate}</dd>
                                </dl>
                            </div>

                            <div slot="footer" class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                <span class="slds-text-body_small">
                                    {card.applicants}
                                    <template lwc:if={card.hasNew}>
                                        <span class="slds-badge slds-badge_inverse slds-m-left_xx-small">
                                            {card.newApplicants}
                                        </span>
                                    </template>
                                </span>
                                <a href={card.href}>
                                    <lightning-button label="View vacancy"></lightning-button>
                                </a>
                            </div>
                        </lightning-card>
                    </lightning-layout-item>
                </template>
            </lightning-layout>

            <div lwc:else class="slds-box slds-theme_default">
                <p>No vacancies for this account.</p>
            </div>
        </main>
    </div>

    <ui-site-footer></ui-site-footer>
</template>
