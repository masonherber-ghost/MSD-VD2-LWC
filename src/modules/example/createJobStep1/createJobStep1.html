<template lwc:render-mode="light">
    <ui-site-header current="create-job"></ui-site-header>

    <div class="site__body">
        <main class="site__main" id="create-job-step1-main">
            <lightning-layout horizontal-align="center">
                <lightning-layout-item id="create-job-step1-col-main" size="12" large-device-size="10">
                    <ui-vacancy-stepper current-step="1"></ui-vacancy-stepper>

                    <!-- Only when the flow was entered from a vacancy's Edit
                         action. Otherwise a pre-filled form gives no clue which
                         record it came from. -->
                    <div
                        lwc:if={isEditing}
                        id="create-job-step1-editing-notice"
                        class="slds-scoped-notification sep-scoped-notification slds-m-bottom_medium"
                    >
                        <p class="sep-scoped-notification__title">Editing an existing vacancy</p>
                        <p class="sep-scoped-notification__body">{editingNotice}</p>
                    </div>

                    <h1 id="create-job-step1-title" class="slds-text-heading_large slds-m-bottom_x-small">
                        First, let's get your company details.
                    </h1>
                    <p id="create-job-step1-intro" class="slds-m-bottom_medium">
                        These details are used to create an employer profile or link your new
                        job listing to existing details we hold about you. All fields are
                        mandatory, unless it says 'optional'.
                    </p>

                    <!-- Our styled scoped notification rather than the design's
                         plain grey block, so every informational panel on the
                         site reads the same. `ui/readOnlyNotice` is not reused
                         here: it appends a fixed "contact your relationship
                         manager" line, which is not this note's message. -->
                    <div
                        id="create-job-step1-privacy-note"
                        class="slds-scoped-notification sep-scoped-notification slds-media slds-media_center slds-m-bottom_large"
                    >
                        <div class="slds-media__figure">
                            <lightning-icon
                                icon-name="utility:info"
                                size="small"
                                alternative-text="Information"
                            ></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p>
                                Company contact details will never be displayed on job listings
                                or given to candidates without your permission.
                            </p>
                        </div>
                    </div>

                    <div lwc:if={loading} id="create-job-step1-loading" class="slds-is-relative slds-box slds-theme_default">
                        <lightning-spinner alternative-text="Loading your company details" size="small"></lightning-spinner>
                    </div>

                    <div lwc:elseif={hasError} id="create-job-step1-error" class="slds-box slds-theme_default">
                        <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                        <span>{error}</span>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                            The data API runs under <code>npm run dev</code> only.
                        </p>
                    </div>

                    <lightning-layout lwc:elseif={ready} multiple-rows pull-to-boundary="small">
                        <lightning-layout-item size="12" large-device-size="8" padding="horizontal-small">
                            <!-- Company information ------------------------------>
                            <h2 id="create-job-step1-company-heading" class="slds-text-heading_medium slds-m-bottom_small">
                                Company information
                            </h2>

                            <div id="create-job-step1-static-company-type" class="slds-form-element slds-form-element_readonly slds-m-bottom_large">
                                <span class="slds-form-element__label">What is your company type?</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static">{companyTypeDisplay}</div>
                                </div>
                            </div>

                            <!-- Industry ------------------------------------------>
                            <h3 class="slds-text-title_bold slds-m-bottom_xx-small">Industry</h3>
                            <div id="create-job-step1-static-industry" class="slds-form-element slds-form-element_readonly slds-m-bottom_medium">
                                <span class="slds-form-element__label">Industry</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static">{industryDisplay}</div>
                                </div>
                            </div>

                            <!-- Company address ------------------------------------>
                            <h3 class="slds-text-title_bold slds-m-bottom_xx-small">Company address</h3>
                            <div id="create-job-step1-static-street" class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                <span class="slds-form-element__label">Street address</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static">{streetDisplay}</div>
                                </div>
                            </div>
                            <div id="create-job-step1-static-district" class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                <span class="slds-form-element__label">District or suburb</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static">{districtDisplay}</div>
                                </div>
                            </div>
                            <div id="create-job-step1-static-postcode" class="slds-form-element slds-form-element_readonly slds-m-bottom_large">
                                <span class="slds-form-element__label">Postcode</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static">{postcodeDisplay}</div>
                                </div>
                            </div>

                            <!-- Company Contact ------------------------------------>
                            <h2 id="create-job-step1-contact-heading" class="slds-text-heading_medium slds-m-bottom_small">
                                Company Contact
                            </h2>
                            <lightning-layout multiple-rows pull-to-boundary="small">
                                <lightning-layout-item size="12" medium-device-size="6" padding="horizontal-small">
                                    <div id="create-job-step1-static-first-name" class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">First name</span>
                                        <div class="slds-form-element__control">
                                            <div class="slds-form-element__static">{firstNameDisplay}</div>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                                <lightning-layout-item size="12" medium-device-size="6" padding="horizontal-small">
                                    <div id="create-job-step1-static-last-name" class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">Last name</span>
                                        <div class="slds-form-element__control">
                                            <div class="slds-form-element__static">{lastNameDisplay}</div>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                            </lightning-layout>
                            <div id="create-job-step1-static-role" class="slds-form-element slds-form-element_readonly slds-m-top_small">
                                <span class="slds-form-element__label">Role</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static">{roleDisplay}</div>
                                </div>
                            </div>
                            <div id="create-job-step1-static-phone" class="slds-form-element slds-form-element_readonly slds-m-top_small">
                                <span class="slds-form-element__label">Phone number</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static">{phoneDisplay}</div>
                                </div>
                            </div>
                            <div id="create-job-step1-static-email" class="slds-form-element slds-form-element_readonly slds-m-top_small slds-m-bottom_large">
                                <span class="slds-form-element__label">Email</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static">{emailDisplay}</div>
                                </div>
                            </div>

                            <!-- Vacancy contact ------------------------------------>
                            <h2 id="create-job-step1-vacancy-contact-heading" class="slds-text-heading_medium slds-m-bottom_xx-small">
                                Vacancy contact <span class="slds-text-body_regular slds-text-color_weak">(optional)</span>
                            </h2>
                            <p class="slds-m-bottom_small">
                                You can add a separate contact person for the management of this listing.
                            </p>
                            <!-- The one editable region on this screen.
                                 Everything above is MSD's record, shown back for
                                 confirmation. A vacancy contact is new
                                 information the employer supplies, so these are
                                 real inputs.

                                 The button swaps rather than sitting alongside:
                                 add reveals the fields and becomes remove. -->
                            <lightning-button
                                lwc:if={showVacancyContact}
                                id="create-job-step1-remove-vacancy-contact"
                                label="Remove vacancy contact"
                                icon-name="utility:close"
                                onclick={handleRemoveVacancyContact}
                                class="slds-m-bottom_medium"
                            ></lightning-button>
                            <lightning-button
                                lwc:else
                                id="create-job-step1-add-vacancy-contact"
                                label="Add vacancy contact"
                                icon-name="utility:add"
                                onclick={handleAddVacancyContact}
                                class="slds-m-bottom_large"
                            ></lightning-button>

                            <div lwc:if={showVacancyContact} id="create-job-step1-vacancy-contact-fields" class="slds-m-bottom_large">
                                <lightning-layout multiple-rows pull-to-boundary="small">
                                    <lightning-layout-item size="12" medium-device-size="6" padding="horizontal-small">
                                        <lightning-input
                                            id="create-job-step1-vc-first-name"
                                            data-field="first_name"
                                            label="First name (optional)"
                                            value={vacancyContact.first_name}
                                            onchange={handleVacancyContactChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6" padding="horizontal-small">
                                        <lightning-input
                                            id="create-job-step1-vc-last-name"
                                            data-field="last_name"
                                            label="Last name"
                                            required
                                            value={vacancyContact.last_name}
                                            onchange={handleVacancyContactChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                                <lightning-combobox
                                    id="create-job-step1-vc-role"
                                    data-field="role"
                                    label="Role (optional)"
                                    options={roles}
                                    value={vacancyContact.role}
                                    onchange={handleVacancyContactChange}
                                    class="slds-m-top_small"
                                ></lightning-combobox>
                                <lightning-input
                                    id="create-job-step1-vc-phone"
                                    data-field="phone"
                                    type="tel"
                                    label="Phone number"
                                    value={vacancyContact.phone}
                                    onchange={handleVacancyContactChange}
                                    class="slds-m-top_small"
                                ></lightning-input>
                                <lightning-input
                                    id="create-job-step1-vc-email"
                                    data-field="email"
                                    type="email"
                                    label="Email"
                                    required
                                    value={vacancyContact.email}
                                    onchange={handleVacancyContactChange}
                                    class="slds-m-top_small"
                                ></lightning-input>
                            </div>

                            <!-- Privacy declaration -------------------------------->
                            <h2 id="create-job-step1-privacy-heading" class="slds-text-heading_medium slds-m-bottom_xx-small">
                                Privacy declaration
                            </h2>
                            <p id="create-job-step1-privacy-text" class="slds-m-bottom_large">
                                By clicking <strong>Next</strong>, you agree with the Ministry of
                                Social Development's
                                <a href="https://www.msd.govt.nz/privacy-notice" target="_blank" rel="noopener">
                                    privacy notice
                                    <lightning-icon
                                        icon-name="utility:new_window"
                                        size="xx-small"
                                        alternative-text="Opens in a new window"
                                        class="slds-m-left_xx-small"
                                    ></lightning-icon>
                                </a>
                                and understand how personal information will be used.
                            </p>

                            <!-- MOCKUP ONLY — this is not reCAPTCHA.
                                 No verification happens, no token is issued and
                                 nothing is sent to Google. It is a real checkbox
                                 dressed in the widget's proportions so the step
                                 reads correctly in the prototype. Wiring the
                                 real thing needs Google's script and a site key,
                                 and neither belongs in a static build.

                                 The wordmark is set as text, not Google's logo:
                                 shipping their brand asset in a mock would be
                                 passing this off as the real control. -->
                            <div id="create-job-step1-captcha" class="create-job-step1__captcha slds-m-bottom_large">
                                <lightning-input
                                    id="create-job-step1-captcha-check"
                                    type="checkbox"
                                    label="I'm not a robot"
                                    checked={captchaChecked}
                                    onchange={handleCaptchaChange}
                                ></lightning-input>
                                <div class="create-job-step1__captcha-brand" aria-hidden="true">
                                    <lightning-icon
                                        icon-name="utility:refresh"
                                        size="small"
                                    ></lightning-icon>
                                    <span class="create-job-step1__captcha-name">reCAPTCHA</span>
                                    <span class="create-job-step1__captcha-legal">Privacy · Terms</span>
                                </div>
                            </div>

                            <div id="create-job-step1-actions" class="slds-text-align_right slds-m-bottom_x-large">
                                <a href="/create-job/step2">
                                    <lightning-button
                                        id="create-job-step1-next"
                                        variant="brand"
                                        label="Next"
                                    ></lightning-button>
                                </a>
                            </div>
                        </lightning-layout-item>

                        <!-- Side note, as the design places it beside the form. -->
                        <lightning-layout-item size="12" large-device-size="4" padding="horizontal-small">
                            <!-- No icon, and therefore no media object: with
                                 nothing in the figure slot the wrapper would be
                                 an empty flex column beside the text. -->
                            <div
                                id="create-job-step1-contact-note"
                                class="slds-scoped-notification sep-scoped-notification"
                            >
                                <p>
                                    Employer and vacancy contact information tells us who we
                                    should talk to about the employer or the job listing.
                                </p>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>
            </lightning-layout>
        </main>
    </div>

    <ui-site-footer></ui-site-footer>
</template>
