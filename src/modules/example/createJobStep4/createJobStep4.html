<template lwc:render-mode="light">
    <ui-site-header current="create-job"></ui-site-header>

    <div class="site__body">
        <main class="site__main" id="create-job-step4-main">
            <lightning-layout horizontal-align="center">
                <lightning-layout-item id="create-job-step4-col-main" size="12" large-device-size="10">
                    <ui-vacancy-stepper current-step="4"></ui-vacancy-stepper>

                    <h1 id="create-job-step4-title" class="slds-text-heading_large slds-m-bottom_large">
                        Skills
                    </h1>

                    <lightning-layout multiple-rows pull-to-boundary="small">
                        <lightning-layout-item size="12" large-device-size="8" padding="horizontal-small">
                            <!-- Important skills --------------------------------->
                            <h2 id="create-job-step4-skills-heading" class="slds-text-heading_medium slds-m-bottom_xx-small">
                                Important skills
                            </h2>
                            <p class="slds-m-bottom_small">
                                Skills can include things like technical proficiencies or specific knowledge.
                            </p>
                            <lightning-input
                                id="create-job-step4-skill-search"
                                type="search"
                                label="What are the most important skills for this role? (Optional)"
                                placeholder="Start typing"
                                value={skillQuery}
                                onchange={handleSkillQuery}
                                onkeyup={handleSkillKeyUp}
                                class="slds-m-bottom_small"
                            ></lightning-input>

                            <!-- Chosen skills. `lightning-pill` is the shipped
                                 removable token; its own X fires `remove`. -->
                            <!-- Chosen skills. `lightning-pill` is the shipped
                                 removable token — its own X fires `remove`, and
                                 `name` carries which skill it was. Used directly
                                 rather than via `lightning-pill-container`,
                                 whose item shape is not documented in the
                                 package. -->
                            <div lwc:if={hasChosenSkills} id="create-job-step4-chosen-skills" class="slds-m-bottom_small">
                                <template for:each={chosenSkills} for:item="skill">
                                    <lightning-pill
                                        key={skill.key}
                                        name={skill.name}
                                        label={skill.name}
                                        variant="plain"
                                        onremove={handleRemoveSkill}
                                        class="slds-m-right_xx-small"
                                    ></lightning-pill>
                                </template>
                            </div>

                            <p id="create-job-step4-suggested-label" class="slds-text-body_small slds-m-bottom_xx-small">
                                Suggested skills for Forklift Driver
                            </p>
                            <div id="create-job-step4-suggestions" class="slds-m-bottom_small">
                                <template for:each={suggestions} for:item="s">
                                    <lightning-button
                                        key={s.key}
                                        data-skill={s.name}
                                        label={s.name}
                                        icon-name="utility:add"
                                        icon-position="right"
                                        variant="brand"
                                        onclick={handleAddSuggestion}
                                        class="slds-m-right_xx-small slds-m-bottom_xx-small"
                                    ></lightning-button>
                                </template>
                            </div>
                            <lightning-button
                                lwc:if={hasMoreSuggestions}
                                id="create-job-step4-show-more"
                                label={moreLabel}
                                icon-name={moreIcon}
                                icon-position="right"
                                onclick={toggleSuggestions}
                                class="slds-m-bottom_large"
                            ></lightning-button>

                            <!-- Important strengths ------------------------------>
                            <h2 id="create-job-step4-strengths-heading" class="slds-text-heading_medium slds-m-bottom_xx-small">
                                Important strengths
                            </h2>
                            <p class="slds-m-bottom_small">
                                Strengths are soft skills or personal qualities that are important for the role.
                            </p>
                            <p id="create-job-step4-strengths-help" class="slds-text-body_small slds-m-bottom_xx-small">
                                {strengthsHelp}
                            </p>
                            <lightning-checkbox-group
                                id="create-job-step4-strengths"
                                label="What are the most important strengths for this role?"
                                options={strengthOptions}
                                value={selectedStrengths}
                                onchange={handleStrengthChange}
                                class="slds-m-bottom_large"
                            ></lightning-checkbox-group>

                            <!-- Language skills ---------------------------------->
                            <h2 id="create-job-step4-languages-heading" class="slds-text-heading_medium slds-m-bottom_xx-small">
                                Language skills
                            </h2>
                            <p class="slds-m-bottom_small">What languages are required for this role?</p>

                            <!-- One panel per language, mirroring `job_languages`
                                 and its child `job_language_abilities`. -->
                            <template for:each={languagePanels} for:item="lang">
                                <div key={lang.id} class="slds-box slds-m-bottom_small">
                                    <lightning-input
                                        data-language={lang.id}
                                        label="Language"
                                        value={lang.name}
                                        onchange={handleLanguageName}
                                        class="slds-m-bottom_small"
                                    ></lightning-input>
                                    <lightning-checkbox-group
                                        data-language={lang.id}
                                        label="What skills in this language are required for this role?"
                                        options={abilityOptions}
                                        value={lang.abilities}
                                        onchange={handleAbilityChange}
                                        class="slds-m-bottom_small"
                                    ></lightning-checkbox-group>
                                    <lightning-button
                                        data-language={lang.id}
                                        variant="brand"
                                        label={lang.saveLabel}
                                        onclick={handleSaveLanguage}
                                    ></lightning-button>
                                </div>
                            </template>

                            <lightning-button
                                id="create-job-step4-add-language"
                                variant="brand"
                                label="Add another language"
                                disabled={addLanguageDisabled}
                                onclick={handleAddLanguage}
                                class="slds-m-bottom_xx-small"
                            ></lightning-button>
                            <p id="create-job-step4-add-language-help" class="slds-text-body_small slds-text-color_weak slds-m-bottom_large">
                                Please save before adding other languages
                            </p>

                            <div id="create-job-step4-actions" class="slds-grid slds-grid_align-end slds-m-bottom_x-large">
                                <a href="/create-job/step3">
                                    <lightning-button id="create-job-step4-previous" label="Previous"></lightning-button>
                                </a>
                                <lightning-button
                                    id="create-job-step4-next"
                                    variant="brand"
                                    label="Next"
                                    class="slds-m-left_x-small"
                                ></lightning-button>
                            </div>
                        </lightning-layout-item>

                        <!-- The three "What is this for?" notes. -->
                        <lightning-layout-item size="12" large-device-size="4" padding="horizontal-small">
                            <div id="create-job-step4-note-skills" class="slds-scoped-notification sep-scoped-notification slds-m-bottom_medium">
                                <p class="sep-scoped-notification__title">What is this for?</p>
                                <p class="sep-scoped-notification__body">
                                    Skills are used to match candidates to the role. The more skills
                                    you add, the better the matches will be.
                                </p>
                            </div>
                            <div id="create-job-step4-note-strengths" class="slds-scoped-notification sep-scoped-notification slds-m-bottom_medium">
                                <p class="sep-scoped-notification__title">What is this for?</p>
                                <p class="sep-scoped-notification__body">
                                    The strengths you consider important for the role get matched to
                                    the strengths candidates list in their profile.
                                </p>
                            </div>
                            <div id="create-job-step4-note-languages" class="slds-scoped-notification sep-scoped-notification">
                                <p class="sep-scoped-notification__title">What is this for?</p>
                                <p class="sep-scoped-notification__body">
                                    The language skills you select get matched to the language skills
                                    candidates list in their profile.
                                </p>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>
            </lightning-layout>
        </main>
    </div>

    <ui-site-footer></ui-site-footer>
</template>
