<template lwc:render-mode="light">
    <ui-site-header current="manage-org"></ui-site-header>

    <div class="site__body">
        <main class="site__main">
            <div lwc:if={loading} class="slds-is-relative manage-org__loading slds-box slds-theme_default">
                <lightning-spinner alternative-text="Loading organisation" size="small"></lightning-spinner>
            </div>

            <template lwc:elseif={isSignedOut}>
                <lightning-card>
                    <div class="slds-p-around_large slds-align_absolute-center slds-text-align_center">
                        <div>
                            <lightning-icon icon-name="utility:lock" size="small"></lightning-icon>
                            <h1 class="slds-text-heading_medium slds-m-top_x-small">
                                Log in to manage your organisation
                            </h1>
                            <div class="slds-m-top_medium">
                                <a href="/login">
                                    <lightning-button variant="brand" label="Log in"></lightning-button>
                                </a>
                            </div>
                        </div>
                    </div>
                </lightning-card>
            </template>

            <template lwc:elseif={ready}>
                <!-- Highlights panel ---------------------------------------->
                <div class="slds-page-header slds-m-bottom_medium">
                    <div class="slds-page-header__row">
                        <div class="slds-page-header__col-title">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon
                                        icon-name="standard:account"
                                        size="medium"
                                    ></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h1 class="slds-page-header__title slds-truncate">{companyName}</h1>
                                    <p class="slds-page-header__name-meta">Manage org</p>
                                </div>
                            </div>
                        </div>
                        <div class="slds-page-header__col-actions">
                            <div class="slds-page-header__controls">
                                <div class="slds-page-header__control">
                                    <lightning-badge label={verifiedLabel}></lightning-badge>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <lightning-tabset variant="scoped">
                    <!-- Tab 1: Org details -------------------------------->
                    <lightning-tab label="Org details">
                        <div lwc:if={hasError} class="slds-m-bottom_small">
                            <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                                <span class="slds-assistive-text">Error</span>
                                <span>{error}</span>
                            </div>
                        </div>
                        <div lwc:if={saved} class="slds-m-bottom_small">
                            <div class="slds-notify slds-notify_alert slds-theme_success" role="status">
                                <span>Organisation details saved.</span>
                            </div>
                        </div>

                        <lightning-card title="Company" icon-name="standard:account">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <lightning-layout multiple-rows class="slds-gutters">
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <div lwc:if={lockCompanyName} class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Company name</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{companyNameDisplay}</div>
                                            </div>
                                            <p class="manage-org__locked">{lockedNote}</p>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            data-field="company_name"
                                            label="Company name"
                                            value={draft.company_name}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <lightning-input
                                            data-field="trading_name"
                                            label="Trading name"
                                            value={draft.trading_name}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <div lwc:if={lockIndustry} class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Industry</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{industryDisplay}</div>
                                            </div>
                                            <p class="manage-org__locked">{lockedNote}</p>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            data-field="industry"
                                            label="Industry"
                                            value={draft.industry}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <div lwc:if={lockOrgType} class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Org type</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{orgTypeDisplay}</div>
                                            </div>
                                            <p class="manage-org__locked">{lockedNote}</p>
                                        </div>
                                        <lightning-combobox
                                            lwc:else
                                            data-field="company_type"
                                            label="Org type"
                                            value={draft.company_type}
                                            options={companyTypes}
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <lightning-input
                                            data-field="web_address"
                                            label="Website"
                                            value={draft.web_address}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <lightning-input
                                            data-field="company_address"
                                            label="Company address"
                                            value={draft.company_address}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <lightning-input
                                            data-field="workplace_address"
                                            label="Workplace address"
                                            value={draft.workplace_address}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        </lightning-card>

                        <lightning-card title="Registration" icon-name="standard:record" class="slds-m-top_medium">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <lightning-layout multiple-rows class="slds-gutters">
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <div lwc:if={lockIrdNumber} class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">IRD number</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{irdNumberDisplay}</div>
                                            </div>
                                            <p class="manage-org__locked">{lockedNote}</p>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            data-field="ird_number"
                                            label="IRD number"
                                            value={draft.ird_number}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6">
                                        <div lwc:if={lockNzbn} class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">NZBN</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{nzbnDisplay}</div>
                                            </div>
                                            <p class="manage-org__locked">{lockedNote}</p>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            data-field="nzbn"
                                            label="NZBN"
                                            value={draft.nzbn}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div slot="footer" class="slds-text-align_right">
                                <lightning-button
                                    label="Cancel"
                                    onclick={handleCancelDetails}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    variant="brand"
                                    label="Save org details"
                                    onclick={handleSaveDetails}
                                    disabled={saving}
                                ></lightning-button>
                            </div>
                        </lightning-card>

                    </lightning-tab>

                    <!-- Tab 2: Manage team -------------------------------->
                    <lightning-tab lwc:if={showTeamTab} label={teamTabLabel}>
                        <div lwc:if={hasTeamMessage} class="slds-m-bottom_small">
                            <div class="slds-notify slds-notify_alert slds-theme_success" role="status">
                                <span>{teamMessage}</span>
                            </div>
                        </div>

                        <!-- Removing someone is destructive, so it is confirmed. -->
                        <div lwc:if={hasPendingRemoval} class="slds-m-bottom_small">
                            <div class="slds-box slds-theme_warning">
                                <p class="slds-text-heading_small">{removalPrompt}</p>
                                <p class="slds-text-body_small slds-m-top_xx-small">
                                    They lose access to this organisation. This cannot be undone.
                                </p>
                                <div class="slds-m-top_small">
                                    <lightning-button
                                        variant="destructive"
                                        label="Remove"
                                        onclick={handleConfirmRemove}
                                        class="slds-m-right_x-small"
                                    ></lightning-button>
                                    <lightning-button
                                        label="Cancel"
                                        onclick={handleCancelRemove}
                                    ></lightning-button>
                                </div>
                            </div>
                        </div>

                        <lightning-card title="Team" icon-name="standard:groups">
                            <span slot="actions" class="slds-text-body_small slds-text-color_weak">
                                {memberCount}
                            </span>
                            <lightning-datatable
                                key-field="id"
                                columns={memberColumns}
                                data={memberRows}
                                onrowaction={handleRowAction}
                                hide-checkbox-column
                            ></lightning-datatable>
                            <p slot="footer" class="slds-text-body_small slds-text-color_weak">
                                Admins can manage the organisation and its team. The primary
                                contact is MSD's point of contact and cannot be removed.
                            </p>
                        </lightning-card>
                    </lightning-tab>
                </lightning-tabset>
            </template>

            <div lwc:else class="slds-box slds-theme_default">
                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                <span>{error}</span>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                    The data API runs under <code>npm run dev</code> only.
                </p>
            </div>
        </main>
    </div>

    <ui-site-footer></ui-site-footer>
</template>
