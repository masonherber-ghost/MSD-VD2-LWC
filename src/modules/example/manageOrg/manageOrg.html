<template lwc:render-mode="light">
    <ui-site-header current="manage-org"></ui-site-header>

    <div class="site__body" id="org-body">
        <main class="site__main" id="org-main">
            <div lwc:if={loading} id="org-loading" class="slds-is-relative manage-org__loading slds-box slds-theme_default">
                <lightning-spinner id="org-loading-spinner" alternative-text="Loading organisation" size="small"></lightning-spinner>
            </div>

            <template lwc:elseif={isSignedOut}>
                <lightning-card id="org-signed-out-card">
                    <div class="slds-p-around_large slds-align_absolute-center slds-text-align_center">
                        <div>
                            <lightning-icon id="org-signed-out-icon" icon-name="utility:lock" size="small"></lightning-icon>
                            <h1 class="slds-text-heading_medium slds-m-top_x-small">
                                Log in to manage your organisation
                            </h1>
                            <div class="slds-m-top_medium">
                                <a href="/login">
                                    <lightning-button id="org-signed-out-login-button" variant="brand" label="Log in"></lightning-button>
                                </a>
                            </div>
                        </div>
                    </div>
                </lightning-card>
            </template>

            <template lwc:elseif={ready}>
                <!-- Highlights panel ---------------------------------------->
                <div id="org-header" class="slds-page-header sep-page-header sep-page-header_spaced slds-m-bottom_medium">
                    <div class="slds-page-header__row">
                        <div class="slds-page-header__col-title">
                            <div class="slds-media__body">
                                <h1 id="org-header-title" class="slds-page-header__title slds-truncate">{companyName}</h1>
                                <p class="slds-page-header__name-meta">Manage org</p>
                            </div>
                        </div>
                        <div class="slds-page-header__col-actions">
                            <div class="slds-page-header__controls">
                                <div class="slds-page-header__control">
                                    <lightning-badge id="org-header-verified-badge" label={verifiedLabel}></lightning-badge>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <lightning-tabset id="org-tabset" variant="scoped">
                    <!-- Tab 1: Org details -------------------------------->
                    <lightning-tab id="org-tab-details" label="Org details">
                        <div lwc:if={hasError} id="org-details-error" class="slds-m-bottom_small">
                            <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                                <span class="slds-assistive-text">Error</span>
                                <span>{error}</span>
                            </div>
                        </div>
                        <div lwc:if={saved} id="org-details-saved" class="slds-m-bottom_small">
                            <div class="slds-notify slds-notify_alert slds-theme_success" role="status">
                                <span>Organisation details saved.</span>
                            </div>
                        </div>

                        <ui-read-only-notice
                            id="org-readonly-notice"
                            message="Some of these organisation details are MSD's record and cannot be changed here."
                        ></ui-read-only-notice>

                        <!-- Your MSD contact.
                             Its own card rather than a field in Company: the
                             relationship manager is MSD's record about the
                             account, not part of the company details the form
                             below edits. Always read-only — there is no
                             editable twin, no `lwc:else` and no draft entry, so
                             it renders as `slds-form-element__static` in every
                             release. -->
                        <lightning-card
                            id="org-relationship-manager-card"
                            title="Your MSD contact"
                            icon-name="standard:user"
                            class="slds-m-bottom_medium"
                        >
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <lightning-layout multiple-rows pull-to-boundary="small">
                                    <lightning-layout-item
                                        id="org-col-relationship-manager"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div
                                            id="org-static-relationship-manager"
                                            class="slds-form-element slds-form-element_readonly"
                                        >
                                            <span class="slds-form-element__label">Relationship manager</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{relationshipManagerDisplay}</div>
                                            </div>
                                        </div>
                                    </lightning-layout-item>
                                    <lightning-layout-item
                                        lwc:if={hasRelationshipManager}
                                        id="org-col-relationship-manager-contact"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <!-- MOCK for the prototype: deliberately
                                             unwired. A working mailto needs an
                                             address column on accounts, which
                                             this change did not add — and
                                             deriving one from the name would be
                                             inventing data. -->
                                        <lightning-button
                                            id="org-relationship-manager-email"
                                            variant="base"
                                            icon-name="utility:email"
                                            label="Email your relationship manager"
                                        ></lightning-button>
                                        <p
                                            id="org-relationship-manager-hint"
                                            class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                                        >
                                            They can help with your listings, candidates and account.
                                        </p>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        </lightning-card>

                        <lightning-card id="org-company-card" title="Company" icon-name="standard:account" class="slds-m-bottom_medium">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <lightning-layout multiple-rows pull-to-boundary="small">
                                    <lightning-layout-item
                                        id="org-col-company-name"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div lwc:if={lockCompanyName} id="org-static-company-name" class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Company name</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{companyNameDisplay}</div>
                                            </div>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            id="org-field-company-name"
                                            data-field="company_name"
                                            label="Company name"
                                            value={draft.company_name}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item
                                        id="org-col-trading-name"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div lwc:if={lockTradingName} id="org-static-trading-name" class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Trading name</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{tradingNameDisplay}</div>
                                            </div>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            id="org-field-trading-name"
                                            data-field="trading_name"
                                            label="Trading name"
                                            value={draft.trading_name}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item
                                        id="org-col-industry"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div lwc:if={lockIndustry} id="org-static-industry" class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Industry</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{industryDisplay}</div>
                                            </div>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            id="org-field-industry"
                                            data-field="industry"
                                            label="Industry"
                                            value={draft.industry}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item
                                        id="org-col-company-type"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div lwc:if={lockOrgType} id="org-static-company-type" class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Org type</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{orgTypeDisplay}</div>
                                            </div>
                                        </div>
                                        <lightning-combobox
                                            lwc:else
                                            id="org-field-company-type"
                                            data-field="company_type"
                                            label="Org type"
                                            value={draft.company_type}
                                            options={companyTypes}
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item
                                        id="org-col-web-address"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div lwc:if={lockWebAddress} id="org-static-web-address" class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Website</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{webAddressDisplay}</div>
                                            </div>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            id="org-field-web-address"
                                            data-field="web_address"
                                            label="Website"
                                            value={draft.web_address}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item
                                        id="org-col-company-address"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div lwc:if={lockCompanyAddress} id="org-static-company-address" class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Company address</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{companyAddressDisplay}</div>
                                            </div>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            id="org-field-company-address"
                                            data-field="company_address"
                                            label="Company address"
                                            value={draft.company_address}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <!-- Workplace address does not exist before 1.2.
                                         The gate is on the whole layout item, not on
                                         its contents: gating the inside would leave an
                                         empty column in the grid. -->
                                    <lightning-layout-item
                                        lwc:if={showWorkplaceAddress}
                                        id="org-col-workplace-address"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div lwc:if={lockWorkplaceAddress} id="org-static-workplace-address" class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">Workplace address</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{workplaceAddressDisplay}</div>
                                            </div>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            id="org-field-workplace-address"
                                            data-field="workplace_address"
                                            label="Workplace address"
                                            value={draft.workplace_address}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        </lightning-card>

                        <lightning-card id="org-registration-card" title="Registration" icon-name="standard:record">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <lightning-layout multiple-rows pull-to-boundary="small">
                                    <lightning-layout-item
                                        id="org-col-ird-number"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div lwc:if={lockIrdNumber} id="org-static-ird-number" class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">IRD number</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{irdNumberDisplay}</div>
                                            </div>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            id="org-field-ird-number"
                                            data-field="ird_number"
                                            label="IRD number"
                                            value={draft.ird_number}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item
                                        id="org-col-nzbn"
                                        size="12"
                                        medium-device-size="6"
                                        padding="horizontal-small"
                                    >
                                        <div lwc:if={lockNzbn} id="org-static-nzbn" class="slds-form-element slds-form-element_readonly">
                                            <span class="slds-form-element__label">NZBN</span>
                                            <div class="slds-form-element__control">
                                                <div class="slds-form-element__static">{nzbnDisplay}</div>
                                            </div>
                                        </div>
                                        <lightning-input
                                            lwc:else
                                            id="org-field-nzbn"
                                            data-field="nzbn"
                                            label="NZBN"
                                            value={draft.nzbn}
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div lwc:if={canEditDetails} slot="footer" id="org-details-actions" class="slds-text-align_right">
                                <lightning-button
                                    id="org-cancel-button"
                                    label="Cancel"
                                    onclick={handleCancelDetails}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    id="org-save-button"
                                    variant="brand"
                                    label="Save org details"
                                    onclick={handleSaveDetails}
                                    disabled={saving}
                                ></lightning-button>
                            </div>
                        </lightning-card>

                    </lightning-tab>

                    <!-- Tab 2: Manage team -------------------------------->
                    <lightning-tab lwc:if={showTeamTab} id="org-tab-team" label={teamTabLabel}>
                        <div lwc:if={hasTeamMessage} id="org-team-message" class="slds-m-bottom_small">
                            <div class="slds-notify slds-notify_alert slds-theme_success" role="status">
                                <span>{teamMessage}</span>
                            </div>
                        </div>

                        <!-- Removing someone is destructive, so it is confirmed. -->
                        <div lwc:if={hasPendingRemoval} id="org-team-removal-confirm" class="slds-m-bottom_small">
                            <div class="slds-box slds-theme_warning">
                                <p class="slds-text-heading_small">{removalPrompt}</p>
                                <p class="slds-text-body_small slds-m-top_xx-small">
                                    They lose access to this organisation. This cannot be undone.
                                </p>
                                <div class="slds-m-top_small">
                                    <lightning-button
                                        id="org-team-remove-confirm-button"
                                        variant="destructive"
                                        label="Remove"
                                        onclick={handleConfirmRemove}
                                        class="slds-m-right_x-small"
                                    ></lightning-button>
                                    <lightning-button
                                        id="org-team-remove-cancel-button"
                                        label="Cancel"
                                        onclick={handleCancelRemove}
                                    ></lightning-button>
                                </div>
                            </div>
                        </div>

                        <lightning-card id="org-team-card" title="Team" icon-name="standard:groups">
                            <span slot="actions" class="slds-text-body_small slds-text-color_weak">
                                {memberCount}
                            </span>
                            <lightning-datatable
                                id="org-team-table"
                                key-field="id"
                                columns={memberColumns}
                                data={memberRows}
                                onrowaction={handleRowAction}
                                hide-checkbox-column
                            ></lightning-datatable>
                            <p slot="footer" class="slds-text-body_small slds-text-color_weak">
                                Admins can manage the organisation and its team. The primary
                                contact is MSD's point of contact and cannot be removed.
                            </p>
                        </lightning-card>
                    </lightning-tab>
                </lightning-tabset>
            </template>

            <div lwc:else id="org-unavailable" class="slds-box slds-theme_default">
                <lightning-icon id="org-unavailable-icon" icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                <span>{error}</span>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                    The data API runs under <code>npm run dev</code> only.
                </p>
            </div>
        </main>
    </div>

    <ui-site-footer></ui-site-footer>
</template>
