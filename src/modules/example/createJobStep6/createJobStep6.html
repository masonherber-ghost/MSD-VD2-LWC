<template lwc:render-mode="light">
    <ui-site-header current="create-job"></ui-site-header>

    <div class="site__body">
        <main class="site__main" id="create-job-step6-main">
            <lightning-layout horizontal-align="center">
                <lightning-layout-item id="create-job-step6-col-main" size="12" large-device-size="10">
                    <ui-vacancy-stepper current-step="6"></ui-vacancy-stepper>

                    <lightning-layout multiple-rows pull-to-boundary="small">
                        <lightning-layout-item id="create-job-step6-col-form" size="12" large-device-size="8" padding="horizontal-small">
                            <h1 id="create-job-step6-title" class="slds-m-bottom_medium">
                                Manage your listing
                            </h1>

                            <!-- Publish timing ----------------------------------
                                 `layout="row"` is the boxes side by side, from
                                 SLDS grid utilities. -->
                            <p id="create-job-step6-publish-help" class="slds-m-bottom_small">
                                Listings are reviewed by our staff before being publically listed
                                for candidates. We aim to get listings up as soon as possible. If
                                crucial information is missing we get in touch within one working day.
                            </p>

                            <ui-radio-box-group
                                id="create-job-step6-publish-timing"
                                name="publish-timing"
                                legend="When would you like the listing to be published?"
                                layout="row"
                                options={timingOptions}
                                value={publishTiming}
                                onchange={handleTimingChange}
                                class="slds-m-bottom_small"
                            ></ui-radio-box-group>

                            <!-- Not in the design, but "Set date" has to ask for
                                 one: it is what puts a value in
                                 `jobs.posted_date`. -->
                            <lightning-input
                                lwc:if={showPublishDate}
                                id="create-job-step6-publish-date"
                                type="date"
                                label="Publish date"
                                value={publishDate}
                                onchange={handlePublishDate}
                                class="slds-m-bottom_large"
                            ></lightning-input>

                            <!-- Positions ---------------------------------------->
                            <h2 id="create-job-step6-positions-heading" class="slds-m-top_large slds-m-bottom_xx-small">
                                Positions
                            </h2>
                            <lightning-input
                                id="create-job-step6-positions"
                                type="number"
                                min="1"
                                label="How many positions are available for the role you are listing?"
                                value={positions}
                                onchange={handlePositions}
                                class="slds-m-bottom_large"
                            ></lightning-input>

                            <!-- Shortlisting ------------------------------------->
                            <h2 id="create-job-step6-shortlisting-heading" class="slds-m-bottom_xx-small">
                                Shortlisting
                            </h2>
                            <lightning-input
                                id="create-job-step6-max-shortlist"
                                type="number"
                                min="1"
                                label="What is the maximum number of candidates you would like shortlisted for this listing?"
                                value={maxShortlist}
                                onchange={handleMaxShortlist}
                                class="slds-m-bottom_large"
                            ></lightning-input>

                            <!-- Interview options -------------------------------->
                            <h2 id="create-job-step6-interview-heading" class="slds-m-bottom_xx-small">
                                Interview options (optional)
                            </h2>
                            <p id="create-job-step6-interview-help" class="slds-m-bottom_x-small">
                                What interview options do you offer?<br />Select all that apply
                            </p>
                            <lightning-checkbox-group
                                id="create-job-step6-interview-options"
                                label="What interview options do you offer?"
                                variant="label-hidden"
                                options={interviewOptions}
                                value={selectedInterviewOptions}
                                onchange={handleInterviewChange}
                                class="slds-m-bottom_large"
                            ></lightning-checkbox-group>

                            <!-- Vacancy contact ------------------------------------
                                 Moved here, to the bottom of the step, from the
                                 removed step 1. Optional: the button swaps
                                 rather than sitting alongside — add reveals the
                                 fields and becomes remove. -->
                            <h2 id="create-job-step6-vacancy-contact-heading" class="slds-m-bottom_xx-small">
                                Vacancy contact <span class="slds-text-body_regular slds-text-color_weak">(optional)</span>
                            </h2>
                            <p id="create-job-step6-vacancy-contact-help" class="slds-m-bottom_small">
                                You can add a separate contact person for the management of this listing.
                            </p>
                            <lightning-button
                                lwc:if={showVacancyContact}
                                id="create-job-step6-remove-vacancy-contact"
                                label="Remove vacancy contact"
                                icon-name="utility:close"
                                onclick={handleRemoveVacancyContact}
                                class="slds-m-bottom_medium"
                            ></lightning-button>
                            <lightning-button
                                lwc:else
                                id="create-job-step6-add-vacancy-contact"
                                label="Add vacancy contact"
                                icon-name="utility:add"
                                onclick={handleAddVacancyContact}
                                class="slds-m-bottom_large"
                            ></lightning-button>

                            <div lwc:if={showVacancyContact} id="create-job-step6-vacancy-contact-fields" class="slds-m-bottom_large">
                                <lightning-layout id="create-job-step6-vacancy-contact-name-row" multiple-rows pull-to-boundary="small">
                                    <lightning-layout-item size="12" medium-device-size="6" padding="horizontal-small">
                                        <lightning-input
                                            id="create-job-step6-vc-first-name"
                                            data-field="first_name"
                                            label="First name (optional)"
                                            value={vacancyContact.first_name}
                                            onchange={handleVacancyContactChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="12" medium-device-size="6" padding="horizontal-small">
                                        <lightning-input
                                            id="create-job-step6-vc-last-name"
                                            data-field="last_name"
                                            label="Last name"
                                            required
                                            value={vacancyContact.last_name}
                                            onchange={handleVacancyContactChange}
                                        ></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                                <lightning-combobox
                                    id="create-job-step6-vc-role"
                                    data-field="role"
                                    label="Role (optional)"
                                    options={roles}
                                    value={vacancyContact.role}
                                    onchange={handleVacancyContactChange}
                                    class="slds-m-top_small"
                                ></lightning-combobox>
                                <lightning-input
                                    id="create-job-step6-vc-phone"
                                    data-field="phone"
                                    type="tel"
                                    label="Phone number"
                                    value={vacancyContact.phone}
                                    onchange={handleVacancyContactChange}
                                    class="slds-m-top_small"
                                ></lightning-input>
                                <lightning-input
                                    id="create-job-step6-vc-email"
                                    data-field="email"
                                    type="email"
                                    label="Email"
                                    required
                                    value={vacancyContact.email}
                                    onchange={handleVacancyContactChange}
                                    class="slds-m-top_small"
                                ></lightning-input>
                            </div>

                            <div id="create-job-step6-actions" class="slds-grid slds-grid_align-end slds-m-bottom_x-large">
                                <a href="/create-job/step5">
                                    <lightning-button id="create-job-step6-previous" label="Previous"></lightning-button>
                                </a>
                                <a href="/create-job/step7">
                                    <lightning-button
                                        id="create-job-step6-review"
                                        variant="brand"
                                        label="Review job"
                                        class="slds-m-left_x-small"
                                    ></lightning-button>
                                </a>
                            </div>
                        </lightning-layout-item>

                        <!-- No icon on this one, as the design draws it. -->
                        <lightning-layout-item id="create-job-step6-col-note" size="12" large-device-size="4" padding="horizontal-small">
                            <div id="create-job-step6-note-visibility" class="slds-scoped-notification">
                                <p>Who can see this?</p>
                                <p>
                                    The information in this section is only used by MSD staff to
                                    help manage your listing and refer candidates.
                                </p>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>
            </lightning-layout>
        </main>
    </div>

    <ui-site-footer></ui-site-footer>
</template>
