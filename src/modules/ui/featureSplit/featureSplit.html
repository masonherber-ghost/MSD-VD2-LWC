<template lwc:render-mode="light">
    <section class="slds-m-bottom_large">
        <lightning-layout multiple-rows pull-to-boundary="small" vertical-align="center">
            <!-- Text first in the DOM whichever side the media sits on, so the
                 heading is read before the image. slds-order_* does the rest. -->
            <lightning-layout-item
                size="12"
                medium-device-size="6"
                padding="around-small"
                class={textClass}
            >
                <h2 class="slds-text-heading_medium slds-m-bottom_small">{heading}</h2>
                <div class="slds-text-longform feature-split__prose">
                    <p lwc:if={intro}>{intro}</p>
                    <ul lwc:if={hasItems} class="slds-list_dotted slds-m-top_x-small">
                        <template for:each={items} for:item="item">
                            <li key={item.key}>{item.text}</li>
                        </template>
                    </ul>
                </div>
                <div lwc:if={linkLabel} class="slds-m-top_small">
                    <a href={linkHref} class="feature-split__link">
                        <lightning-button variant="base" label={linkLabel}></lightning-button>
                    </a>
                </div>
            </lightning-layout-item>

            <lightning-layout-item
                size="12"
                medium-device-size="6"
                padding="around-small"
                class={mediaClass}
            >
                <ui-illustration-panel
                    icon-name={iconName}
                    alternative-text={heading}
                ></ui-illustration-panel>
            </lightning-layout-item>
        </lightning-layout>
    </section>
</template>
