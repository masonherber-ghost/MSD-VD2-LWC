<template lwc:render-mode="light">
    <!-- The project's empty-state convention is a plain box with the way out,
         as on /jobs — not an slds-illustration, which would need an asset we
         do not ship. -->
    <div class="slds-box slds-theme_default slds-text-align_center">
        <lightning-icon icon-name="standard:job_profile" size="large"></lightning-icon>

        <h2 class="slds-text-heading_medium slds-m-top_small">
            You have no vacancies yet
        </h2>

        <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
            List your first job to start reaching job seekers across Aotearoa and
            receiving applications.
        </p>

        <div class="slds-m-top_medium">
            <a href="/list-a-job">
                <lightning-button variant="brand" label="List a job"></lightning-button>
            </a>
        </div>
    </div>
</template>
