<template lwc:render-mode="light">
    <div class="sink slds-grid">
        <nav class="sink__rail">
            <div class="sink__search slds-p-around_small">
                <lightning-input
                    type="search"
                    label="Filter components"
                    variant="label-hidden"
                    placeholder="Filter components..."
                    value={query}
                    onchange={handleSearch}
                ></lightning-input>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                    {matchCount} of {totalCount}
                </p>
            </div>
            <ul class="sink__list">
                <template for:each={componentList} for:item="item">
                    <li key={item.name}>
                        <button
                            class={item.className}
                            data-name={item.name}
                            onclick={handleSelectComponent}
                        >
                            <span class="sink__tag">{item.tag}</span>
                            <span class="sink__count">{item.count}</span>
                        </button>
                    </li>
                </template>
            </ul>
        </nav>

        <section class="sink__detail slds-p-around_medium">
            <header class="slds-m-bottom_small">
                <h2 class="slds-text-heading_medium">{current.tag}</h2>
                <dl class="sink__meta slds-text-body_small">
                    <dt>Module</dt>
                    <dd><code>{current.module}</code></dd>
                    <dt>API</dt>
                    <dd>{apiVersion}</dd>
                    <dt>Slots</dt>
                    <dd>{slotList}</dd>
                    <dt>Properties</dt>
                    <dd>{propertyList}</dd>
                </dl>
            </header>

            <template lwc:if={hasExamples}>
                <div class="sink__examples">
                    <template for:each={exampleTabs} for:item="tab">
                        <button
                            key={tab.id}
                            class={tab.className}
                            data-id={tab.id}
                            onclick={handleSelectExample}
                        >{tab.label}</button>
                    </template>
                </div>
                <ui-example-stage example-id={selectedExample}></ui-example-stage>
            </template>

            <div lwc:else class="slds-box slds-theme_shade">
                <p class="slds-text-body_small">
                    No examples ship with this component. It is still usable —
                    drop <code>{current.tag}</code> into any template.
                </p>
            </div>
        </section>
    </div>
</template>
