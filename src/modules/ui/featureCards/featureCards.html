<template lwc:render-mode="light">
    <section class="slds-m-bottom_large">
        <h2 class="slds-m-bottom_small">{heading}</h2>
        <p lwc:if={intro} class="slds-text-longform feature-cards__intro slds-m-bottom_medium">
            {intro}
        </p>

        <lightning-layout multiple-rows pull-to-boundary="small">
            <template for:each={cards} for:item="card">
                <lightning-layout-item
                    key={card.key}
                    size="12"
                    medium-device-size="4"
                    padding="around-small"
                    class="feature-cards__cell"
                >
                    <!-- hide-header, because the card header wraps its title in
                         slds-truncate: these headings run to two lines and would
                         be clipped. label keeps the article's accessible name. -->
                    <lightning-card hide-header label={card.title} class="feature-cards__card">
                        <div class="slds-p-horizontal_medium slds-p-vertical_small">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon
                                        icon-name={card.iconName}
                                        size="small"
                                    ></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h3>{card.title}</h3>
                                    <p class="slds-m-top_xx-small feature-cards__body">
                                        {card.body}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </lightning-card>
                </lightning-layout-item>
            </template>
        </lightning-layout>

        <div lwc:if={linkLabel} class="slds-m-top_small">
            <a href={linkHref} class="feature-cards__link">
                <lightning-button variant="base" label={linkLabel}></lightning-button>
            </a>
        </div>
    </section>
</template>
