<template lwc:render-mode="light">
    <footer class="site-footer">
        <div class="site-footer__inner slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-button-menu
                    icon-name="utility:apps"
                    icon-size="small"
                    variant="bare"
                    alternative-text="App Launcher"
                    menu-alignment="bottom-left"
                    onselect={handleAppSelect}
                >
                    <lightning-menu-item
                        value="/"
                        label="Employer portal"
                        prefix-icon-name="utility:company"
                    ></lightning-menu-item>
                    <lightning-menu-item
                        value="/design-system"
                        label="Design system"
                        prefix-icon-name="utility:palette"
                    ></lightning-menu-item>
                    <lightning-menu-item
                        value="/data"
                        label="Data browser"
                        prefix-icon-name="utility:database"
                    ></lightning-menu-item>
                    <lightning-menu-item
                        value="/emails"
                        label="Email browser"
                        prefix-icon-name="utility:email"
                    ></lightning-menu-item>
                </lightning-button-menu>
                <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">
                    Prototype &mdash; release preview
                </span>
            </div>

            <div class="site-footer__toggle slds-grid slds-grid_vertical-align-center">
                <span class="slds-text-body_small slds-m-right_x-small">Viewing release</span>
                <lightning-radio-group
                    label="Release"
                    variant="label-hidden"
                    type="button"
                    value={release}
                    options={options}
                    onchange={handleReleaseChange}
                ></lightning-radio-group>
            </div>
        </div>
    </footer>
</template>
