<template lwc:render-mode="light">
    <div class="vacancy-card">
        <!-- In review carries a standing notice, ABOVE the card rather than
             inside it, full width with 8px (`x-small`) between it and the card.
             Default styling: the blueprint's light variant with the info icon,
             no theme and no `sep-` skin. `role="status"` rather than `alert`:
             it is not urgent and should not interrupt. -->
        <div
            lwc:if={card.isInReview}
            class="slds-scoped-notification slds-scoped-notification_light slds-media slds-media_center slds-m-bottom_x-small"
            role="status"
        >
            <div class="slds-media__figure">
                <lightning-icon
                    icon-name="utility:info"
                    size="x-small"
                    alternative-text="Information"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p>{card.reviewNotice}</p>
            </div>
        </div>

        <!-- No `icon-name`.
             `lightning-card` renders its icon as a <lightning-icon> inside its
             own shadow root, in a figure with no slot, so custom artwork cannot
             be put there. Omitting the attribute makes the card's `hasIcon`
             false and suppresses that figure entirely; the media object below
             rebuilds it in the title slot, which IS ours. -->
        <lightning-card>
            <h2 slot="title" class="slds-media vacancy-card__heading">
                <span class="slds-media__figure vacancy-card__figure">
                    <!-- The vacancy's category icon, chosen from its job type.
                         Decorative: alt is empty so the heading still reads as
                         the vacancy's title, exactly as it did when the shipped
                         icon sat here. The category is not otherwise on the
                         card — if it should be announced, give it an alt rather
                         than a second line. -->
                    <img
                        lwc:if={card.iconUrl}
                        src={card.iconUrl}
                        alt=""
                        class="vacancy-card__icon"
                    />
                    <!-- No icon for this job type yet, so the card keeps the
                         icon it always had. See `server/lib/job-icons.ts`. -->
                    <lightning-icon
                        lwc:else
                        icon-name="standard:job_profile"
                        size="small"
                    ></lightning-icon>
                </span>

                <span class="slds-media__body slds-truncate vacancy-card__body">
                    <!-- The title is the card's link.
                         It used to stretch a ::after over the whole card so any
                         click opened the vacancy. That went when the card gained
                         the action column below: an overlay covering the card
                         also covers the actions, and the Lightning pattern for a
                         card that carries actions is a linked title rather than
                         a linked surface. -->
                    <a href={card.href} class="vacancy-card__link" title={card.title}>
                        {card.title}
                    </a>
                    <span
                        lwc:if={card.subtitle}
                        class="slds-text-body_small slds-text-color_weak vacancy-card__subtitle"
                    >
                        {card.subtitle}
                    </span>
                </span>

                <!-- The status pill, as the heading row's last item rather than
                     in the card's `actions` slot.

                     `lightning-card` wraps its header below 42.688em — its
                     resize-reflow rule for 200-400% zoom — so anything in the
                     actions slot drops under the title on a phone. That rule
                     lives on the card's own header part; turning it off would be
                     restyling the card's internals. In the title slot the pill
                     is in a row we own, so it stays top right at every width.

                     `slds-align-top` pins it to the top of the row while the
                     icon and title stay centred. The figure classes give it the
                     icon's no-shrink, no-margin treatment; the heading's gap
                     spaces it. It is inside the heading, so the status is read
                     with the title. -->
                <span class="slds-media__figure vacancy-card__figure slds-align-top">
                    <lightning-badge
                        label={card.statusLabel}
                        class={card.statusClass}
                    ></lightning-badge>
                </span>
            </h2>


            <!-- Body: metadata left, actions right.
                 The design puts the action column at 86% across a 912px card,
                 so it is 2 of 12 at the large breakpoint and 3 of 12 at medium,
                 where 2 columns would crowd the labels. Both fall to `size=12`
                 below that and the column stacks under the metadata.

                 Padding is the documented pair: `horizontal-small` on each item
                 with `pull-to-boundary="small"` on the parent, which cancels at
                 the outer edges so the wrapper's own padding still sets the
                 card's inset. -->
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <lightning-layout multiple-rows pull-to-boundary="small" vertical-align="center">
                    <lightning-layout-item
                        size="12"
                        medium-device-size="9"
                        large-device-size="10"
                        padding="horizontal-small"
                    >
                        <!-- One icon + value pair per line. -->
                        <div class="vacancy-card__meta">
                            <template for:each={card.meta} for:item="item">
                                <span key={item.key} class="vacancy-card__meta-item">
                                    <lightning-icon
                                        icon-name={item.icon}
                                        size="xx-small"
                                        class="vacancy-card__meta-icon"
                                    ></lightning-icon>
                                    <span lwc:if={item.label} class="slds-assistive-text">{item.label}</span>
                                    <span class="vacancy-card__meta-value">{item.value}</span>
                                </span>
                            </template>

                            <span lwc:if={showApplicants} class="vacancy-card__meta-item">
                                <lightning-icon
                                    icon-name="utility:groups"
                                    size="xx-small"
                                    class="vacancy-card__meta-icon"
                                ></lightning-icon>
                                <span class="vacancy-card__meta-value">{card.applicants}</span>
                                <span
                                    lwc:if={card.hasNew}
                                    class="slds-badge slds-badge_inverse slds-m-left_xx-small"
                                >
                                    {card.newApplicants}
                                </span>
                            </span>
                        </div>
                    </lightning-layout-item>

                    <!-- The action column: one row-action menu.
                         `lightning-button-menu` at its defaults — the bordered
                         icon trigger with `utility:down` — is the shipped
                         `slds-dropdown-trigger`, so the opening, keyboard
                         handling and focus return are Salesforce's. It replaced a
                         stack of base buttons and the CSS that tightened them.

                         `auto-right` aligns the menu's right edge to the trigger
                         and flips it upward when there is no room below — a card
                         near the foot of the viewport would otherwise open its
                         menu off-screen.

                         No `id` on anything in this component: the card renders
                         once per row inside a `for:each` in `example/jobs`, and a
                         static id would repeat. `data-action` is the handle, per
                         `rules-lwc-layout.md` § Every landmark element gets an id.

                         WHICH items appear is the vacancy's lifecycle state —
                         `data/vacancyRules` owns that, so this stays
                         presentational. A state with nothing to offer
                         (`in_review`, which is with MSD) gets one disabled line
                         saying why, rather than an empty menu.

                         What each item DOES is still unwired, matching
                         `example/jobDetail`'s header actions. -->
                    <!-- Bottom right of its cell: `slds-align-bottom` overrides the
                         row's `vertical-align="center"` for this item alone, and
                         `slds-grid_align-end` inside it pushes the trigger right.
                         Stacked on a phone, it is simply the right of its row. -->
                    <lightning-layout-item
                        size="12"
                        medium-device-size="3"
                        large-device-size="2"
                        padding="horizontal-small"
                        class="slds-align-bottom"
                    >
                        <div class="slds-grid slds-grid_align-end">
                            <lightning-button-menu
                                alternative-text={actionsLabel}
                                menu-alignment="auto-right"
                            >
                                <template for:each={card.actions} for:item="action">
                                    <lightning-menu-item
                                        key={action.key}
                                        value={action.key}
                                        label={action.label}
                                        prefix-icon-name={action.icon}
                                        disabled={action.disabled}
                                        data-action={action.key}
                                    ></lightning-menu-item>
                                </template>
                            </lightning-button-menu>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </lightning-card>
    </div>
</template>
