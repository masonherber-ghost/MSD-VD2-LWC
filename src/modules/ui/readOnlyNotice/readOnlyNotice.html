<template lwc:render-mode="light">
    <!-- Informational, deliberately not an alert.
         `slds-scoped-notification` is the quiet, in-page blueprint — it sits
         inside the content it describes rather than shouting over it, which is
         what separates it from the error `ui/alert` used for save failures on
         these same screens. Unskinned: the scoped notification exactly as SLDS
         ships it, laid out with SLDS media objects and text utilities only.

         No `role`. A scoped notification is often given `role="status"`, but
         that makes it a live region, which is for content that CHANGES — this
         copy is present on every render, so announcing it as an update would be
         wrong. As a plain paragraph it is read in document order instead.

         The margin lives on this div rather than on the host: a custom element
         is `display: inline`, so a margin on `ui-read-only-notice` would compute
         and never apply. -->
    <div id={ids.root} class="slds-scoped-notification slds-m-bottom_medium">
        <!-- With a heading: icon beside the heading (a media object), description
             underneath. -->
        <template lwc:if={heading}>
            <div id={ids.header} class="slds-media slds-media_center">
                <div class="slds-media__figure">
                    <lightning-icon
                        id={ids.iconStacked}
                        icon-name="utility:info"
                        size="small"
                        alternative-text="Information"
                    ></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p id={ids.title} class="slds-text-title_bold">{heading}</p>
                </div>
            </div>
            <p id={ids.body} class="slds-m-top_x-small">
                {message} To change anything, contact your relationship manager or
                <a id={ids.contactLinkStacked} href="/contact-us">contact us</a>.
            </p>
        </template>

        <!-- Without a heading: a plain media object. The stacked form would put
             the icon on a row of its own above the text, which reads as a
             missing heading rather than as a deliberate choice. -->
        <div lwc:else id={ids.inline} class="slds-media slds-media_center">
            <div class="slds-media__figure">
                <lightning-icon
                    id={ids.iconInline}
                    icon-name="utility:info"
                    size="small"
                    alternative-text="Information"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p>
                    {message} To change anything, contact your relationship manager or
                    <a id={ids.contactLinkInline} href="/contact-us">contact us</a>.
                </p>
            </div>
        </div>
    </div>
</template>
