<template lwc:render-mode="light">
    <header class="slds-global-header_container">
        <div class="slds-global-header slds-grid">
            <!-- The bar stays full-bleed; this inner row carries the content cap
                 so the wordmark lines up with the page below. See site.css. -->
            <div class="site-header__inner slds-grid slds-grid_align-spread">
                <div class="slds-global-header__item site-header__brand">
                    <!-- The same three destinations twice, swapped by the SLDS
                         responsive utilities at 768px: the menu below that
                         width, the inline row above it. `slds-hide_medium` and
                         `slds-show_medium` each set `display:none !important`
                         on the other side of the breakpoint, so only one is
                         ever in the layout. -->
                    <lightning-button-menu
                        lwc:if={isSignedIn}
                        class="site-header__menu-trigger slds-hide_medium slds-m-right_xx-small"
                        icon-name="utility:rows"
                        icon-size="small"
                        variant="bare"
                        alternative-text="Open navigation"
                        menu-alignment="left"
                    >
                        <lightning-menu-item
                            href="/list-a-job"
                            label="List a job"
                            prefix-icon-name="utility:new"
                        ></lightning-menu-item>
                        <lightning-menu-item
                            href="/jobs"
                            label="My jobs"
                            prefix-icon-name="utility:list"
                        ></lightning-menu-item>
                        <lightning-menu-item
                            href="/help-centre"
                            label="Help centre"
                            prefix-icon-name="utility:question"
                        ></lightning-menu-item>
                        <!-- The desktop dropdown's items, flattened under a
                             subheader: a menu inside a menu has nowhere to
                             open on a phone. -->
                        <lightning-menu-subheader label="Help centre"></lightning-menu-subheader>
                        <lightning-menu-item
                            href="/about-this-site"
                            label="About this site"
                        ></lightning-menu-item>
                        <lightning-menu-item
                            href="/how-it-works"
                            label="How it works"
                        ></lightning-menu-item>
                        <lightning-menu-item
                            href="/contact-us"
                            label="Contact us"
                        ></lightning-menu-item>
                        <lightning-menu-item
                            href="/request-support"
                            label="Request support"
                        ></lightning-menu-item>
                    </lightning-button-menu>

                    <div class="slds-global-header__logo site-header__logo">
                        <a href="/" class="site-header__wordmark">MSD</a>
                    </div>

                    <!-- Main nav is for signed-in employers only. -->
                    <nav lwc:if={isSignedIn} class="site-header__nav slds-show_medium">
                        <a href="/list-a-job" class={listAJobClass}>List a job</a>
                        <a href="/jobs" class={myJobsClass}>My jobs</a>
                        <!-- icon-name="utility:chevrondown" is deliberate: the
                             menu appends its own utility:down unless the icon is
                             already a down chevron, so any other name renders
                             two carets. -->
                        <lightning-button-menu
                            class={helpCentreMenuClass}
                            label="Help centre"
                            icon-name="utility:chevrondown"
                            variant="bare"
                            menu-alignment="left"
                        >
                            <lightning-menu-item
                                href="/help-centre"
                                label="Help centre"
                            ></lightning-menu-item>
                            <lightning-menu-divider></lightning-menu-divider>
                            <lightning-menu-item
                                href="/about-this-site"
                                label="About this site"
                            ></lightning-menu-item>
                            <lightning-menu-item
                                href="/how-it-works"
                                label="How it works"
                            ></lightning-menu-item>
                            <lightning-menu-item
                                href="/contact-us"
                                label="Contact us"
                            ></lightning-menu-item>
                            <lightning-menu-item
                                href="/request-support"
                                label="Request support"
                            ></lightning-menu-item>
                        </lightning-button-menu>
                    </nav>
                </div>

                <div class="slds-global-header__item">
                    <ul class="slds-global-actions slds-grid slds-grid_vertical-align-center">
                        <template lwc:if={isSignedIn}>
                            <li lwc:if={showNotifications} class="slds-global-actions__item">
                                <lightning-button-icon
                                    icon-name="utility:notification"
                                    variant="bare"
                                    alternative-text="Notifications"
                                ></lightning-button-icon>
                            </li>
                            <li class="slds-global-actions__item slds-p-left_x-small site-header__profile">
                                <lightning-avatar
                                    fallback-icon-name="standard:user"
                                    alternative-text={userName}
                                    size="small"
                                ></lightning-avatar>
                                <lightning-button-menu
                                    icon-name="utility:down"
                                    icon-size="x-small"
                                    variant="bare"
                                    alternative-text="Account menu"
                                    menu-alignment="right"
                                    onselect={handleProfileSelect}
                                >
                                    <lightning-menu-item
                                        value="/profile"
                                        label="My profile"
                                        prefix-icon-name="utility:user"
                                    ></lightning-menu-item>
                                    <lightning-menu-item
                                        value="/manage-org"
                                        label="Manage org"
                                        prefix-icon-name="utility:settings"
                                    ></lightning-menu-item>
                                    <lightning-menu-item
                                        value="sign-out"
                                        label="Log out"
                                        prefix-icon-name="utility:logout"
                                    ></lightning-menu-item>
                                </lightning-button-menu>
                            </li>
                        </template>

                        <!-- Signed out: one way in. -->
                        <li lwc:else class="slds-global-actions__item">
                            <a href="/login" class={loginClass}>Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
</template>
