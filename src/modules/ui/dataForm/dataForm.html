<template lwc:render-mode="light">
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_medium">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button
                    class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close"
                    onclick={handleCancel}
                >
                    <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                </button>
                <h2 class="slds-modal__title slds-hyphenate">{heading}</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <div lwc:if={hasError} class="slds-box slds-theme_error slds-m-bottom_small">
                    {error}
                </div>

                <div class="data-form__grid">
                    <template for:each={fields} for:item="field">
                        <div key={field.name} class="data-form__field" data-field={field.name}>
                            <lightning-combobox
                                lwc:if={field.isSelect}
                                name={field.name}
                                label={field.label}
                                value={field.value}
                                options={field.options}
                                required={field.required}
                                onchange={handleChange}
                            ></lightning-combobox>

                            <lightning-textarea
                                lwc:elseif={field.isTextarea}
                                name={field.name}
                                label={field.label}
                                value={field.value}
                                required={field.required}
                                onchange={handleChange}
                            ></lightning-textarea>

                            <lightning-input
                                lwc:else
                                name={field.name}
                                label={field.label}
                                value={field.value}
                                required={field.required}
                                field-level-help={field.helpText}
                                onchange={handleChange}
                            ></lightning-input>
                        </div>
                    </template>
                </div>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                <lightning-button
                    class="slds-m-left_x-small"
                    variant="brand"
                    label="Save"
                    disabled={saving}
                    onclick={handleSave}
                ></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
