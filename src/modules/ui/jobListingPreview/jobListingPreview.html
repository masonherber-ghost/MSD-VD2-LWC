<template lwc:render-mode="light">
    <!-- Every `id` here is built from `id-prefix`, which the page sets
         (`job-detail-listing`, `create-job-step7-listing`). This component
         renders on two routes, so a fixed id could not stay unique; see `ids`
         in the .ts. `data-section` stays as the Edit buttons' handle — an id
         is for identity, not for lookup. -->
    <div id={ids.root} class="job-listing-preview">
        <lightning-layout id={ids.layout} multiple-rows pull-to-boundary="small">
            <!-- The listing itself ------------------------------------------->
            <lightning-layout-item
                id={ids.colMain}
                size="12"
                medium-device-size="7"
                large-device-size="8"
                padding="horizontal-small"
            >
                <!-- "Preview Job" above the title. Record page only
                     (`show-preview-heading`). The status lives in the Manage
                     Job card above (Figma 570:93671), not here. -->
                <h6 lwc:if={showPreviewHeading} id={ids.previewHeading} class="slds-m-bottom_x-small slds-text-heading_small">Preview Job</h6>

                <div class="slds-grid slds-grid_align-spread">
                    <h1 id={ids.title} class="slds-text-heading_large">{title}</h1>
                    <lightning-button
                        lwc:if={editable}
                        variant="base"
                        icon-name="utility:edit"
                        label="Edit"
                        id={ids.titleEditButton}
                        data-section="title"
                        onclick={handleEdit}
                    ></lightning-button>
                </div>
                <p lwc:if={subtitle} id={ids.subtitle} class="slds-text-body_regular slds-m-bottom_small">{subtitle}</p>

                <!-- Facts, location first. Only the rows the record holds.
                     A row with `editSection` carries the create flow's Edit
                     button (`editable`); today that is location alone. Its id
                     comes from the getter — never a static id in a for:each. -->
                <ul id={ids.facts} class="slds-m-bottom_small">
                    <template for:each={facts} for:item="fact">
                        <li key={fact.key} class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                            <div class="slds-media slds-media_center">
                                <div class="slds-media__figure">
                                    <lightning-icon
                                        icon-name={fact.icon}
                                        size="x-small"
                                        alternative-text={fact.label}
                                    ></lightning-icon>
                                </div>
                                <div class="slds-media__body">{fact.value}</div>
                            </div>
                            <lightning-button
                                lwc:if={fact.showEdit}
                                variant="base"
                                icon-name="utility:edit"
                                label="Edit"
                                id={fact.editId}
                                data-section={fact.editSection}
                                onclick={handleEdit}
                            ></lightning-button>
                        </li>
                    </template>
                </ul>

                <!-- Job description ------------------------------------------>
                <!-- Job ID ----------------------------------------------------
                     The business key an employer quotes to MSD. Left out when
                     the record has none. -->
                <template lwc:if={jobId}>
                    <hr />
                    <div id={ids.jobId}>
                        <h4 id={ids.jobIdHeading} class="slds-m-bottom_x-small slds-text-heading_small">Job ID</h4>
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <span id={ids.jobIdValue} class="slds-text-heading_small">{jobId}</span>
                            <span class="slds-text-color_weak slds-m-horizontal_small" aria-hidden="true">&bull;</span>
                            <lightning-button
                                id={ids.jobIdCopyButton}
                                variant="base"
                                icon-name="utility:copy"
                                label="Copy Job ID"
                                onclick={handleCopyJobId}
                            ></lightning-button>
                        </div>
                    </div>
                </template>

                <hr />

                <!-- Each section heading sits in a flex row only so the create
                     flow's Edit button (`editable`) lands on its right. On the
                     record page the row holds the heading alone.

                     Sections are separated by a plain `hr`, as the design draws
                     them. No `lightning-*` component renders a separator
                     (`lightning-menu-divider` is for menus only); SLDS styles
                     the element itself — a 1px --slds-g-color-border-1 rule with
                     --slds-g-spacing-6 above and below. That margin owns the
                     spacing between sections, so the blocks carry no bottom
                     margin of their own. -->
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <h4 id={ids.descriptionHeading} class="slds-text-heading_small" >Job description</h4>
                    <lightning-button
                        lwc:if={editable}
                        variant="base"
                        icon-name="utility:edit"
                        label="Edit"
                        id={ids.descriptionEditButton}
                        data-section="description"
                        onclick={handleEdit}
                    ></lightning-button>
                </div>
                <p lwc:if={hasDescription} id={ids.description}>{description}</p>
                <p lwc:else id={ids.descriptionEmpty} class="slds-text-color_weak">Nothing added.</p>

                <!-- The four sections below are two columns from the large
                     breakpoint up — heading 2/5, content 3/5 (Figma
                     570:103964) — and stack below it. The SLDS grid, not
                     lightning-layout: its items size in twelfths, and 2/5 is
                     not a whole number of them. `slds-gutters_small` pairs
                     with `slds-col` here, which is what it is written for. -->
                <template lwc:if={hasResponsibilities}>
                <!-- Key responsibilities — shown only when the job has some; no create step edits them. -->
                <hr />
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-5">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <h6 id={ids.responsibilitiesHeading} class="slds-text-heading_small">Key responsibilities</h6>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-5">
                        <ul id={ids.responsibilities} class="slds-list_dotted">
                            <template for:each={responsibilities} for:item="item">
                                <li key={item.key}>{item.label}</li>
                            </template>
                        </ul>
                    </div>
                </div>
                </template>

                <!-- What makes this job great -->
                <hr />
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-5">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <h6 id={ids.sellingPointsHeading} class="slds-text-heading_small">What makes this job great</h6>
                            <lightning-button
                                lwc:if={editable}
                                variant="base"
                                icon-name="utility:edit"
                                label="Edit"
                                id={ids.sellingPointsEditButton}
                                data-section="selling-points"
                                onclick={handleEdit}
                            ></lightning-button>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-5">
                        <ul lwc:if={hasSellingPoints} id={ids.sellingPoints} class="slds-list_dotted">
                            <template for:each={sellingPoints} for:item="point">
                                <li key={point.key}>{point.label}</li>
                            </template>
                        </ul>
                        <p lwc:else id={ids.sellingPointsEmpty} class="slds-text-color_weak">Nothing added.</p>
                    </div>
                </div>

                <!-- On-the-job training. No column holds this — see the docblock. -->
                <hr />
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-5">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <h6 id={ids.trainingHeading} class="slds-text-heading_small">On-the-job training</h6>
                            <lightning-button
                                lwc:if={editable}
                                variant="base"
                                icon-name="utility:edit"
                                label="Edit"
                                id={ids.trainingEditButton}
                                data-section="training"
                                onclick={handleEdit}
                            ></lightning-button>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-5">
                        <p lwc:if={hasTraining} id={ids.training}>
                            <strong>{training.label}</strong> — {training.description}
                        </p>
                        <p lwc:else id={ids.trainingEmpty} class="slds-text-color_weak">Nothing added.</p>
                    </div>
                </div>

                <!-- Pre-employment checks -->
                <hr />
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-5">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <h6 id={ids.checksHeading} class="slds-text-heading_small">Pre-employment checks</h6>
                            <lightning-button
                                lwc:if={editable}
                                variant="base"
                                icon-name="utility:edit"
                                label="Edit"
                                id={ids.checksEditButton}
                                data-section="pre-employment-checks"
                                onclick={handleEdit}
                            ></lightning-button>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-5">
                        <ul lwc:if={hasPreEmploymentChecks} id={ids.checks} class="slds-list_dotted">
                            <template for:each={preEmploymentChecks} for:item="check">
                                <li key={check.key}>{check.label}</li>
                            </template>
                        </ul>
                        <p lwc:else id={ids.checksEmpty} class="slds-text-color_weak">Nothing added.</p>
                    </div>
                </div>

                <!-- Work schedule moved into the About card, where the design
                     (Figma 570:93671) draws it — see `buildAboutSections`. -->
            </lightning-layout-item>

            <!-- About the job ------------------------------------------------>
            <lightning-layout-item
                id={ids.colAbout}
                size="12"
                medium-device-size="5"
                large-device-size="4"
                padding="horizontal-small"
            >
                <lightning-card id={ids.aboutCard} class="job-listing-preview__about-card">
                    <!-- The title through the slot rather than `title="…"`, so it
                         can carry `slds-text-heading_medium`: a string title is
                         drawn inside the card's shadow root, out of reach of a
                         class. Slotted, it inherits the card's own <h2> — bold —
                         so its weight is set back to the page's heading weight
                         with the card's public hook (see the .css). -->
                    <h3 slot="title" id={ids.aboutHeading} class="slds-text-heading_medium">About the mahi</h3>
                    <!-- 16px left, right and bottom; none on top — the card
                         header above supplies that (see the .css). -->
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                        <template for:each={aboutSections} for:item="section">
                            <div key={section.key} id={section.id}>
                                <!-- A rule between sections, as the design has
                                     it; not above the first. Medium margins —
                                     the card is denser than the page. -->
                                <hr lwc:if={section.showDivider} class="slds-m-vertical_medium" />
                                <div class="slds-grid slds-grid_align-spread">
                                    <h6>{section.heading}</h6>
                                    <lightning-button
                                        lwc:if={editable}
                                        variant="base"
                                        icon-name="utility:edit"
                                        label="Edit"
                                        id={section.editId}
                                        data-section={section.section}
                                        onclick={handleEdit}
                                    ></lightning-button>
                                </div>

                                <p lwc:if={section.isEmpty} class="slds-text-body_small slds-text-color_weak">
                                    {section.emptyText}
                                </p>

                                <!-- Flat chips: location, skills, strengths, study,
                                     endorsements, experience.

                                     Each badge sits in its own span, so no two
                                     `.slds-badge` are adjacent siblings: SLDS's
                                     `.slds-badge + .slds-badge` margin would
                                     otherwise indent the first badge of every
                                     wrapped line. Markup only, no CSS. -->
                                <div lwc:elseif={section.isChips} class="slds-m-top_xx-small">
                                    <template for:each={section.chips} for:item="chip">
                                        <span key={chip.key} class="slds-m-right_xx-small"><span class={chipClass}>{chip.label}</span></span>
                                    </template>
                                </div>

                                <!-- One group per parent row: a schedule part, a
                                     language with its abilities, a licence class
                                     with its stage. A bold title over its badges,
                                     unboxed, as the design draws them. -->
                                <template lwc:elseif={section.isBoxes}>
                                    <template for:each={section.boxes} for:item="box">
                                        <div key={box.key} class="slds-m-top_small">
                                            <p class="slds-text-title_bold slds-m-bottom_xx-small">{box.title}</p>
                                            <template for:each={box.chips} for:item="chip">
                                                <span key={chip.key} class="slds-m-right_xx-small"><span class={chipClass}>{chip.label}</span></span>
                                            </template>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </template>
                    </div>
                </lightning-card>
            </lightning-layout-item>
        </lightning-layout>
    </div>
</template>
