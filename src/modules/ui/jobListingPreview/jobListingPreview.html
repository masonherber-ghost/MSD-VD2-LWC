<template lwc:render-mode="light">
    <!-- Every `id` here is built from `id-prefix`, which the page sets
         (`job-detail-listing`, `create-job-step7-listing`). This component
         renders on two routes, so a fixed id could not stay unique; see `ids`
         in the .ts. `data-section` stays as the Edit buttons' handle — an id
         is for identity, not for lookup. -->
    <div id={ids.root} class="job-listing-preview">
        <lightning-layout id={ids.layout} multiple-rows pull-to-boundary="small">
            <!-- The listing itself ------------------------------------------->
            <lightning-layout-item
                id={ids.colMain}
                size="12"
                medium-device-size="7"
                large-device-size="8"
                padding="horizontal-small"
            >
                <!-- "Job preview" on the left; "Status:" and the status tag
                     on the right, as the design has it. Record page only
                     (`show-preview-heading`). -->
                <div
                    lwc:if={showPreviewHeading}
                    class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small"
                >
                    <h6 id={ids.previewHeading}>Job preview</h6>
                    <div id={ids.statusGroup} class="slds-grid slds-grid_vertical-align-center">
                        <span id={ids.statusLabel}>Status:</span>
                        <lightning-badge
                            id={ids.status}
                            label={statusLabel}
                            class={statusBadgeClass}
                        ></lightning-badge>
                    </div>
                </div>

                <div class="slds-grid slds-grid_align-spread">
                    <h1 id={ids.title}>{title}</h1>
                    <lightning-button
                        lwc:if={editable}
                        variant="base"
                        icon-name="utility:edit"
                        label="Edit"
                        id={ids.titleEditButton}
                        data-section="title"
                        onclick={handleEdit}
                    ></lightning-button>
                </div>
                <p lwc:if={subtitle} id={ids.subtitle} class="slds-text-body_regular slds-m-bottom_small">{subtitle}</p>

                <div lwc:if={location} id={ids.location} class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon
                                id={ids.locationIcon}
                                icon-name="utility:location"
                                size="x-small"
                                alternative-text="Location"
                            ></lightning-icon>
                        </div>
                        <div class="slds-media__body">{location}</div>
                    </div>
                    <lightning-button
                        lwc:if={editable}
                        variant="base"
                        icon-name="utility:edit"
                        label="Edit"
                        id={ids.locationEditButton}
                        data-section="location"
                        onclick={handleEdit}
                    ></lightning-button>
                </div>

                <!-- Facts. Only the rows the record holds. -->
                <ul id={ids.facts}>
                    <template for:each={facts} for:item="fact">
                        <li key={fact.key} class="slds-media slds-media_center slds-m-bottom_x-small">
                            <div class="slds-media__figure">
                                <lightning-icon
                                    icon-name={fact.icon}
                                    size="x-small"
                                    alternative-text={fact.label}
                                ></lightning-icon>
                            </div>
                            <div class="slds-media__body">{fact.value}</div>
                        </li>
                    </template>
                </ul>

                <!-- Job description ------------------------------------------>
                <!-- Job ID ----------------------------------------------------
                     The business key an employer quotes to MSD. Left out when
                     the record has none. -->
                <template lwc:if={jobId}>
                    <hr />
                    <div id={ids.jobId}>
                        <h4 id={ids.jobIdHeading} class="slds-m-bottom_x-small">Job ID</h4>
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <span id={ids.jobIdValue} class="slds-text-heading_small">{jobId}</span>
                            <span class="slds-text-color_weak slds-m-horizontal_small" aria-hidden="true">&bull;</span>
                            <lightning-button
                                id={ids.jobIdCopyButton}
                                variant="base"
                                icon-name="utility:copy"
                                label="Copy Job ID"
                                onclick={handleCopyJobId}
                            ></lightning-button>
                        </div>
                    </div>
                </template>

                <hr />

                <!-- Each section heading sits in a flex row only so the create
                     flow's Edit button (`editable`) lands on its right. On the
                     record page the row holds the heading alone.

                     Sections are separated by a plain `hr`, as the design draws
                     them. No `lightning-*` component renders a separator
                     (`lightning-menu-divider` is for menus only); SLDS styles
                     the element itself — a 1px --slds-g-color-border-1 rule with
                     --slds-g-spacing-6 above and below. That margin owns the
                     spacing between sections, so the blocks carry no bottom
                     margin of their own. -->
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <h4 id={ids.descriptionHeading}>Job description</h4>
                    <lightning-button
                        lwc:if={editable}
                        variant="base"
                        icon-name="utility:edit"
                        label="Edit"
                        id={ids.descriptionEditButton}
                        data-section="description"
                        onclick={handleEdit}
                    ></lightning-button>
                </div>
                <p lwc:if={hasDescription} id={ids.description}>{description}</p>
                <p lwc:else id={ids.descriptionEmpty} class="slds-text-color_weak">Nothing added.</p>

                <!-- What makes this job great -------------------------------->
                <hr />
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <h6 id={ids.sellingPointsHeading}>What makes this job great</h6>
                    <lightning-button
                        lwc:if={editable}
                        variant="base"
                        icon-name="utility:edit"
                        label="Edit"
                        id={ids.sellingPointsEditButton}
                        data-section="selling-points"
                        onclick={handleEdit}
                    ></lightning-button>
                </div>
                <ul lwc:if={hasSellingPoints} id={ids.sellingPoints} class="slds-list_dotted">
                    <template for:each={sellingPoints} for:item="point">
                        <li key={point.key}>{point.label}</li>
                    </template>
                </ul>
                <p lwc:else id={ids.sellingPointsEmpty} class="slds-text-color_weak">Nothing added.</p>

                <!-- On-the-job training. No column holds this — see the docblock. -->
                <hr />
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <h6 id={ids.trainingHeading}>On-the-job training</h6>
                    <lightning-button
                        lwc:if={editable}
                        variant="base"
                        icon-name="utility:edit"
                        label="Edit"
                        id={ids.trainingEditButton}
                        data-section="training"
                        onclick={handleEdit}
                    ></lightning-button>
                </div>
                <p lwc:if={hasTraining} id={ids.training}>
                    <strong>{training.label}</strong> — {training.description}
                </p>
                <p lwc:else id={ids.trainingEmpty} class="slds-text-color_weak">Nothing added.</p>

                <!-- Pre-employment checks ------------------------------------>
                <hr />
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <h6 id={ids.checksHeading}>Pre-employment checks</h6>
                    <lightning-button
                        lwc:if={editable}
                        variant="base"
                        icon-name="utility:edit"
                        label="Edit"
                        id={ids.checksEditButton}
                        data-section="pre-employment-checks"
                        onclick={handleEdit}
                    ></lightning-button>
                </div>
                <ul lwc:if={hasPreEmploymentChecks} id={ids.checks} class="slds-list_dotted">
                    <template for:each={preEmploymentChecks} for:item="check">
                        <li key={check.key}>{check.label}</li>
                    </template>
                </ul>
                <p lwc:else id={ids.checksEmpty} class="slds-text-color_weak">Nothing added.</p>

                <!-- Work schedule -------------------------------------------->
                <hr />
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <h6 id={ids.scheduleHeading}>Work schedule</h6>
                    <lightning-button
                        lwc:if={editable}
                        variant="base"
                        icon-name="utility:edit"
                        label="Edit"
                        id={ids.scheduleEditButton}
                        data-section="schedule"
                        onclick={handleEdit}
                    ></lightning-button>
                </div>
                <template lwc:if={hasSchedule}>
                    <dl id={ids.schedule}>
                        <template lwc:if={scheduleType}>
                            <dt class="slds-text-title_bold">Schedule type</dt>
                            <dd class="slds-m-bottom_small">{scheduleType}</dd>
                        </template>
                        <template lwc:if={hasScheduleDays}>
                            <dt class="slds-text-title_bold">Days</dt>
                            <dd class="slds-m-bottom_small">
                                <template for:each={scheduleDays} for:item="day">
                                    <lightning-badge
                                        key={day.key}
                                        label={day.label}
                                        class="slds-m-right_xx-small"
                                    ></lightning-badge>
                                </template>
                            </dd>
                        </template>
                        <template lwc:if={scheduleHours}>
                            <dt class="slds-text-title_bold">Working hours</dt>
                            <dd class="slds-m-bottom_small">{scheduleHours}</dd>
                        </template>
                        <template lwc:if={scheduleAdditional}>
                            <dt class="slds-text-title_bold">Additional information</dt>
                            <dd class="slds-m-bottom_small">{scheduleAdditional}</dd>
                        </template>
                    </dl>
                </template>
                <p lwc:else id={ids.scheduleEmpty} class="slds-text-color_weak">Nothing added.</p>
            </lightning-layout-item>

            <!-- About the job ------------------------------------------------>
            <lightning-layout-item
                id={ids.colAbout}
                size="12"
                medium-device-size="5"
                large-device-size="4"
                padding="horizontal-small"
            >
                <lightning-card id={ids.aboutCard} class="job-listing-preview__about-card">
                    <!-- The title through the slot rather than `title="…"`, so it
                         can carry `slds-text-heading_medium`: a string title is
                         drawn inside the card's shadow root, out of reach of a
                         class. A span, not a heading — the card already wraps
                         the slot in its own <h2>, so this stays a heading
                         without nesting one in another. -->
                    <span slot="title" id={ids.aboutHeading} class="slds-text-heading_large">About the job</span>
                    <!-- 16px left, right and bottom; none on top — the card
                         header above supplies that (see the .css). -->
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                        <template for:each={aboutSections} for:item="section">
                            <div key={section.key} id={section.id}>
                                <!-- A rule between sections, as the design has
                                     it; not above the first. Medium margins —
                                     the card is denser than the page. -->
                                <hr lwc:if={section.showDivider} class="slds-m-vertical_medium" />
                                <div class="slds-grid slds-grid_align-spread">
                                    <h6>{section.heading}</h6>
                                    <lightning-button
                                        lwc:if={editable}
                                        variant="base"
                                        icon-name="utility:edit"
                                        label="Edit"
                                        id={section.editId}
                                        data-section={section.section}
                                        onclick={handleEdit}
                                    ></lightning-button>
                                </div>

                                <p lwc:if={section.isEmpty} class="slds-text-body_small slds-text-color_weak">
                                    {section.emptyText}
                                </p>

                                <!-- Flat chips: strengths, skills, study,
                                     endorsements, experience. -->
                                <div lwc:elseif={section.isChips} class="slds-m-top_xx-small">
                                    <template for:each={section.chips} for:item="chip">
                                        <lightning-badge
                                            key={chip.key}
                                            label={chip.label}
                                            class="slds-m-right_xx-small slds-m-bottom_xx-small"
                                        ></lightning-badge>
                                    </template>
                                </div>

                                <!-- One box per parent row: a language with its
                                     abilities, a licence class with its stage. -->
                                <template lwc:elseif={section.isBoxes}>
                                    <template for:each={section.boxes} for:item="box">
                                        <div key={box.key} class="slds-box slds-m-top_x-small">
                                            <p class="slds-text-title_bold slds-m-bottom_xx-small">{box.title}</p>
                                            <template for:each={box.chips} for:item="chip">
                                                <lightning-badge
                                                    key={chip.key}
                                                    label={chip.label}
                                                    class="slds-m-right_xx-small"
                                                ></lightning-badge>
                                            </template>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </template>
                    </div>
                </lightning-card>
            </lightning-layout-item>
        </lightning-layout>
    </div>
</template>
