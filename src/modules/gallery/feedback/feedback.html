<template lwc:render-mode="light">
    <ui-demo-card
        label="Alerts, confirms & prompts"
        note="Imperative overlays opened with a static open() call that resolves a promise."
        code={overlayCode}
    >
        <div class="demo-grid">
            <lightning-button label="Alert" onclick={handleAlert}></lightning-button>
            <lightning-button label="Confirm" onclick={handleConfirm}></lightning-button>
            <lightning-button label="Prompt" onclick={handlePrompt}></lightning-button>
            <lightning-button variant="brand" label="Toast" onclick={handleToast}></lightning-button>
        </div>
        <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
            Last result: {lastResult}
        </p>
    </ui-demo-card>

    <ui-demo-card label="Spinner" note="lightning-spinner overlays its positioned container while work is in flight.">
        <div class="slds-is-relative demo-spinner-stage slds-box slds-box_x-small">
            <lightning-spinner
                lwc:if={showSpinner}
                alternative-text="Loading"
                size="medium"
            ></lightning-spinner>
            <p class="slds-text-body_small">Content area</p>
        </div>
        <div class="slds-m-top_small">
            <lightning-button label="Load for 1.5s" onclick={handleSpinner}></lightning-button>
        </div>
    </ui-demo-card>

    <ui-demo-card label="Progress" note="lightning-progress-bar, lightning-progress-ring and lightning-progress-indicator.">
        <lightning-progress-bar value={progress} size="large"></lightning-progress-bar>
        <div class="demo-grid slds-m-top_medium">
            <lightning-progress-ring value={progress}></lightning-progress-ring>
            <lightning-progress-ring value={progress} variant="active-step"></lightning-progress-ring>
            <lightning-button label="Advance" onclick={handleProgress}></lightning-button>
        </div>
        <div class="slds-m-top_large">
            <lightning-progress-indicator current-step="2" type="base" variant="base">
                <lightning-progress-step label="Contacted" value="1"></lightning-progress-step>
                <lightning-progress-step label="Qualified" value="2"></lightning-progress-step>
                <lightning-progress-step label="Proposal" value="3"></lightning-progress-step>
                <lightning-progress-step label="Closed" value="4"></lightning-progress-step>
            </lightning-progress-indicator>
        </div>
    </ui-demo-card>

    <ui-demo-card label="Inline help" note="lightning-helptext attaches a tooltip to any label.">
        <div class="demo-grid">
            <span>Annual revenue</span>
            <lightning-helptext content="Total revenue for the last financial year."></lightning-helptext>
        </div>
    </ui-demo-card>
</template>
