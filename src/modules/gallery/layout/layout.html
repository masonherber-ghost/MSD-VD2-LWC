<template lwc:render-mode="light">
    <ui-demo-card
        label="Grid layout"
        note="lightning-layout / lightning-layout-item wrap the SLDS 12-column grid."
        code={layoutCode}
    >
        <lightning-layout multiple-rows="true" horizontal-align="spread">
            <lightning-layout-item size="4" padding="around-small">
                <div class="slds-box slds-box_xx-small slds-text-align_center">size 4</div>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
                <div class="slds-box slds-box_xx-small slds-text-align_center">size 4</div>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
                <div class="slds-box slds-box_xx-small slds-text-align_center">size 4</div>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="around-small">
                <div class="slds-box slds-box_xx-small slds-text-align_center">size 6</div>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="around-small">
                <div class="slds-box slds-box_xx-small slds-text-align_center">size 6</div>
            </lightning-layout-item>
        </lightning-layout>
    </ui-demo-card>

    <ui-demo-card label="Cards" note="lightning-card with title, icon, actions and footer slots.">
        <lightning-layout multiple-rows="true">
            <lightning-layout-item size="6" padding="around-small">
                <lightning-card title="Account details" icon-name="standard:account">
                    <lightning-button slot="actions" label="Edit"></lightning-button>
                    <div class="slds-var-p-horizontal_small">
                        Acme Corporation is a manufacturing account based in Melbourne.
                    </div>
                    <div slot="footer" class="slds-text-body_small slds-text-color_weak">
                        Last updated today
                    </div>
                </lightning-card>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="around-small">
                <lightning-card title="Narrow variant" variant="narrow" icon-name="utility:info">
                    <div class="slds-var-p-horizontal_small">Compact card body.</div>
                </lightning-card>
            </lightning-layout-item>
        </lightning-layout>
    </ui-demo-card>

    <ui-demo-card label="Tabs" note="lightning-tabset with base, scoped and vertical variants.">
        <lightning-tabset active-tab-value="details">
            <lightning-tab label="Details" value="details">
                <p class="slds-p-around_small">Tab content for details.</p>
            </lightning-tab>
            <lightning-tab label="Related" value="related" icon-name="utility:rows">
                <p class="slds-p-around_small">Tab content for related records.</p>
            </lightning-tab>
            <lightning-tab label="Activity" value="activity">
                <p class="slds-p-around_small">Tab content for activity.</p>
            </lightning-tab>
        </lightning-tabset>

        <div class="slds-m-top_large">
            <lightning-tabset variant="scoped" active-tab-value="one">
                <lightning-tab label="Scoped one" value="one">
                    <p class="slds-p-around_small">Scoped variant.</p>
                </lightning-tab>
                <lightning-tab label="Scoped two" value="two">
                    <p class="slds-p-around_small">Second scoped tab.</p>
                </lightning-tab>
            </lightning-tabset>
        </div>
    </ui-demo-card>

    <ui-demo-card label="Accordion" note="lightning-accordion with collapsible sections.">
        <lightning-accordion active-section-name="first">
            <lightning-accordion-section name="first" label="Company profile">
                <p>Industry, headcount and trading history.</p>
            </lightning-accordion-section>
            <lightning-accordion-section name="second" label="Billing">
                <p>Payment terms and invoicing contacts.</p>
            </lightning-accordion-section>
            <lightning-accordion-section name="third" label="Compliance">
                <p>Insurance certificates and licences.</p>
            </lightning-accordion-section>
        </lightning-accordion>
    </ui-demo-card>

    <ui-demo-card label="Breadcrumbs & vertical navigation" note="lightning-breadcrumbs and the nav used by this site's sidebar.">
        <lightning-breadcrumbs>
            <template for:each={crumbs} for:item="crumb">
                <lightning-breadcrumb
                    key={crumb.name}
                    label={crumb.label}
                    href="#"
                ></lightning-breadcrumb>
            </template>
        </lightning-breadcrumbs>

        <div class="slds-m-top_medium demo-nav-stage">
            <lightning-vertical-navigation selected-item="reports" shaded>
                <lightning-vertical-navigation-section label="Reporting">
                    <lightning-vertical-navigation-item label="Dashboards" name="dashboards"></lightning-vertical-navigation-item>
                    <lightning-vertical-navigation-item label="Reports" name="reports"></lightning-vertical-navigation-item>
                    <lightning-vertical-navigation-item label="Exports" name="exports"></lightning-vertical-navigation-item>
                </lightning-vertical-navigation-section>
            </lightning-vertical-navigation>
        </div>
    </ui-demo-card>
</template>
