<template lwc:render-mode="light">
    <p class="slds-m-bottom_small">
        <code>slds-theme_*</code> classes on the host. They colour the host, not the
        badge's own inner pill, so in this build the grey pill shows on top. Use the
        hooks instead (see <em>Status Hooks</em>), or the badge <em>blueprint</em>,
        where the class and the pill are the same element (Blueprints tab → badge).
    </p>
    <lightning-badge label="Info" class="slds-theme_info"></lightning-badge>
    <lightning-badge label="Success" class="slds-theme_success"></lightning-badge>
    <lightning-badge label="Warning" class="slds-theme_warning"></lightning-badge>
    <lightning-badge label="Error" class="slds-theme_error"></lightning-badge>
</template>
